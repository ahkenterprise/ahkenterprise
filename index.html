<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Welcome | AHK Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:#0b192c;height:100vh;height:100dvh;width:100vw;display:flex;justify-content:center;align-items:center;position:fixed;top:0;left:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
    body::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100vw;height:100vh;background:radial-gradient(circle at center,rgba(230,46,60,0.12) 0%,transparent 60%);z-index:0;pointer-events:none}
    .landing-wrapper{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:20px;text-align:center}
    .landing-logo{max-width:250px;height:auto;display:block;margin-bottom:50px;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5));cursor:pointer;user-select:none;transition:transform .2s}
    .landing-logo:active{transform:scale(.95)}
    .single-btn{display:inline-block;padding:20px 55px;font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;text-decoration:none;color:#fff;background:#e62e3c;border:2px solid #e62e3c;border-radius:50px;transition:all .4s ease;box-shadow:0 10px 30px rgba(230,46,60,.3);cursor:pointer}
    .single-btn:hover,.single-btn:active{background:transparent;color:#e62e3c;transform:translateY(-2px);box-shadow:0 15px 40px rgba(230,46,60,.5)}
    .modal{display:none;position:fixed;z-index:999999;left:0;top:0;width:100%;height:100%;background:rgba(11,25,44,.85);backdrop-filter:blur(8px);justify-content:center;align-items:center;padding:15px}
    .modal-content{background:#11223a;padding:30px;border-radius:20px;border:1px solid rgba(230,46,60,.2);box-shadow:0 20px 50px rgba(0,0,0,.5);width:100%;max-width:420px;position:relative;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fadeIn .3s cubic-bezier(.175,.885,.32,1.275)}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-header{text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #2a3b52}
    .modal-header h2{color:#fff;font-family:'Montserrat',sans-serif;font-size:1.2rem;letter-spacing:1px}
    .modal-header p{color:#a0aec0;font-size:.85rem;margin-top:5px}
    .close-btn{position:absolute;top:15px;right:20px;color:#a0aec0;font-size:28px;font-weight:bold;cursor:pointer;line-height:1;padding:5px;transition:color .3s}
    .close-btn:hover,.close-btn:active{color:#e62e3c}
    .admin-input-group{margin-bottom:15px;text-align:left}
    .admin-input-group label{display:block;color:#a0aec0;font-size:.85rem;margin-bottom:5px}
    .admin-input-group input{width:100%;padding:15px;border-radius:12px;border:1px solid #4a5a70;background:#11223a;color:#fff;font-family:'Poppins',sans-serif;outline:none;font-size:1rem;transition:border-color .3s}
    .admin-input-group input:focus{border-color:#e62e3c}
    .add-btn{width:100%;padding:15px;background:#e62e3c;color:#fff;border:none;border-radius:12px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:1rem;cursor:pointer;transition:.3s}
    .add-btn:hover,.add-btn:active{background:#c9212f}
    .add-btn:disabled{opacity:.6;cursor:not-allowed}
    .google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;margin-top:8px;background:#fff;color:#333;border:none;border-radius:12px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer;transition:.2s}
    .google-btn:hover,.google-btn:active{background:#f1f1f1}
    .google-btn:disabled{opacity:.6;cursor:not-allowed}
    .error-msg{color:#ff4d4d;font-size:.85rem;text-align:center;margin-top:15px;display:none;background:rgba(255,77,77,.1);padding:10px;border-radius:8px}
    .admin-panel{border:1px solid #4a5a70;background:#0d1b2a}
    .admin-panel .modal-header h2{color:#e62e3c}
    .admin-user{display:flex;align-items:center;gap:12px;padding:10px;background:#11223a;border-radius:12px;margin-bottom:15px;border:1px solid #2a3b52}
    .admin-user strong{color:#fff;font-size:.9rem;display:block}
    .admin-user small{color:#a0aec0;font-size:.75rem}
    .admin-avatar{width:40px;height:40px;border-radius:50%;background:#e62e3c;object-fit:cover;flex-shrink:0}
    .admin-list-title{color:#fff;font-size:.85rem;margin-top:25px;margin-bottom:10px;text-align:left;border-bottom:1px solid #4a5a70;padding-bottom:5px}
    .admin-link-item{display:flex;justify-content:space-between;align-items:center;background:#11223a;padding:10px 12px;border-radius:8px;margin-bottom:8px;border-left:3px solid #e62e3c}
    .admin-link-item.hidden-link{opacity:.5;border-left-color:#4a5a70}
    .admin-link-info{text-align:left;flex-grow:1;overflow:hidden}
    .admin-link-info strong{color:#fff;font-size:.9rem;display:block}
    .admin-link-info small{color:#a0aec0;font-size:.7rem;display:block}
    .action-btn{background:transparent;border:none;cursor:pointer;font-size:1.2rem;margin-left:8px;padding:5px;transition:transform .2s}
    .action-btn:hover,.action-btn:active{transform:scale(1.1)}
    .toggle-btn{color:#4CAF50}
    .toggle-btn.is-hidden{color:#889cb5}
    .edit-btn{color:#4a9eff}
    .logout-btn,.reset-btn,.seed-btn,.test-api-btn{width:100%;padding:12px;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;transition:.3s;font-size:.9rem;background:transparent}
    .test-api-btn{color:#9b59b6;border:1px solid #9b59b6;margin-top:15px}
    .test-api-btn:hover{background:#9b59b6;color:#fff}
    .seed-btn{color:#4CAF50;border:1px solid #4CAF50;margin-top:15px}
    .seed-btn:hover{background:#4CAF50;color:#fff}
    .reset-btn{color:#f39c12;border:1px solid #f39c12;margin-top:15px}
    .reset-btn:hover{background:#f39c12;color:#fff}
    .logout-btn{color:#ff4d4d;border:1px solid #ff4d4d;margin-top:10px}
    .logout-btn:hover{background:#ff4d4d;color:#fff}
    .loading-state{text-align:center;padding:30px 10px}
    .loading-state p{color:#a0aec0;font-size:.85rem;margin-top:15px}
    .spinner{width:36px;height:36px;margin:0 auto;border:3px solid #2a3b52;border-top-color:#e62e3c;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{color:#a0aec0;font-size:.85rem;text-align:center;padding:20px 10px;background:#11223a;border-radius:8px}
    .config-warning{position:fixed;top:0;left:0;right:0;z-index:9999999;background:#f39c12;color:#1a1a1a;text-align:center;font-size:.8rem;padding:8px 12px;font-weight:500}
    @media(max-width:480px){.landing-logo{max-width:180px;margin-bottom:40px}.single-btn{padding:18px 40px;font-size:1rem;width:100%}.modal-content{padding:25px 20px;max-height:90vh}.close-btn{top:10px;right:15px}}
</style>
</head>
<body>

<div id="configWarning" class="config-warning" style="display:none;">
    ⚠️ Firebase not configured — running in <strong>demo mode</strong>.
</div>

<div class="landing-wrapper">
    <img src="logo.png" alt="AHK Enterprise Logo" class="landing-logo" id="secretLogo">
    <button id="openOptionsBtn" class="single-btn">Enter</button>
</div>

<div id="optionsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeOptions">&times;</span>
        <div class="modal-header">
            <h2>Open App</h2>
            <p>Enter the app name to continue</p>
        </div>
        <div class="admin-input-group">
            <input type="text" id="searchAppInput" placeholder="e.g., Mi Gym App"
                   autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <button class="add-btn" id="searchOpenBtn">Open Now</button>
        <p id="searchError" class="error-msg"></p>
    </div>
</div>

<div id="adminModal" class="modal">
    <div class="modal-content admin-panel">
        <span class="close-btn" id="closeAdmin">&times;</span>

        <div id="authLoading" class="loading-state" style="display:none;">
            <div class="spinner"></div>
            <p>Verifying…</p>
        </div>

        <div id="authSection">
            <div class="modal-header">
                <h2>🔒 Admin Access</h2>
                <p>Sign in with your Google account.</p>
            </div>
            <button id="googleSignInBtn" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
            <p id="authError" class="error-msg"></p>
        </div>

        <div id="adminContentSection" style="display:none;">
            <div class="admin-user">
                <img id="adminAvatar" class="admin-avatar" alt="Admin">
                <div>
                    <strong id="adminName">Admin</strong>
                    <small id="adminEmailDisplay">—</small>
                </div>
            </div>
            <div class="modal-header">
                <h2>⚙️ Admin Panel</h2>
                <p>Manage Apps &amp; Visibility</p>
            </div>
            <div class="admin-input-group">
                <label>Display Name (Exact Name to search)</label>
                <input type="text" id="newLinkName" placeholder="e.g., New App" autocomplete="off">
            </div>
            <div class="admin-input-group">
                <label>Folder Path / URL</label>
                <input type="text" id="newLinkUrl" placeholder="e.g., newapp/index.html" autocomplete="off">
            </div>
            <button class="add-btn" id="addLinkBtn">+ Add App</button>

            <div class="admin-list-title">App List (✏️ Edit · 👁️ Hide · 🗑️ Remove)</div>
            <div id="adminLinksList"></div>

            <button class="test-api-btn" id="testApiBtn">🔐 Test Secure API</button>
            <button class="seed-btn"  id="seedBtn"  style="display:none;">🌱 Seed Default Apps</button>
            <button class="reset-btn" id="resetBtn">⚠️ Reset Everything</button>
            <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>
    </div>
</div>

<script src="/deter.js" defer></script>
<script type="module" src="/app.js"></script>
</body>
</html>
