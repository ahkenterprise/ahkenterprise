<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Welcome | AHK Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
iframe[title="Netlify"], #netlify-badge, div[id*="netlify"], a[href*="netlify.com"], .netlify-badge,
body > iframe[style*="position: fixed"] { display:none!important; visibility:hidden!important; pointer-events:none!important; }

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0b192c;height:100dvh;width:100vw;display:flex;justify-content:center;align-items:center;position:fixed;inset:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(230,46,60,.12) 0%,transparent 60%);pointer-events:none}
button:focus-visible,input:focus-visible,.landing-logo:focus-visible{outline:2px solid #e62e3c;outline-offset:3px}

.landing-wrapper{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:20px;text-align:center}
.landing-logo{max-width:250px;height:auto;display:block;margin-bottom:50px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s}
.landing-logo:active{transform:scale(.95)}
.logo-fallback{display:none;font-family:'Montserrat',sans-serif;font-weight:800;font-size:2.6rem;letter-spacing:4px;color:#fff;margin-bottom:50px;cursor:pointer;user-select:none;-webkit-user-select:none;padding:10px 20px}
.single-btn{display:inline-block;padding:20px 55px;font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#fff;background:#e62e3c;border:2px solid #e62e3c;border-radius:50px;transition:all .4s ease;box-shadow:0 10px 30px rgba(230,46,60,.3);cursor:pointer}
.single-btn:hover,.single-btn:active{background:transparent;color:#e62e3c;transform:translateY(-2px);box-shadow:0 15px 40px rgba(230,46,60,.5)}

.modal{display:none;position:fixed;z-index:999999;inset:0;background:rgba(11,25,44,.85);backdrop-filter:blur(8px);justify-content:center;align-items:center;padding:15px}
.modal-content{background:#11223a;padding:30px;border-radius:20px;border:1px solid rgba(230,46,60,.2);box-shadow:0 20px 50px rgba(0,0,0,.5);width:100%;max-width:420px;position:relative;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fadeIn .3s cubic-bezier(.175,.885,.32,1.275)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.modal-header{text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #2a3b52}
.modal-header h2{color:#fff;font-family:'Montserrat',sans-serif;font-size:1.2rem;letter-spacing:1px}
.modal-header p{color:#a0aec0;font-size:.85rem;margin-top:5px}
.close-btn{position:absolute;top:10px;right:15px;color:#a0aec0;font-size:28px;font-weight:bold;cursor:pointer;line-height:1;padding:8px;background:none;border:none;transition:color .3s}
.close-btn:hover,.close-btn:active{color:#e62e3c}

.admin-input-group{margin-bottom:15px;text-align:left}
.admin-input-group label{display:block;color:#a0aec0;font-size:.85rem;margin-bottom:5px}
.admin-input-group input{width:100%;padding:15px;border-radius:12px;border:1px solid #4a5a70;background:#11223a;color:#fff;font-family:'Poppins',sans-serif;outline:none;font-size:1rem;transition:border-color .3s}
.admin-input-group input:focus{border-color:#e62e3c}
.add-btn{width:100%;padding:15px;background:#e62e3c;color:#fff;border:none;border-radius:12px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:1rem;cursor:pointer;transition:.3s}
.add-btn:hover,.add-btn:active{background:#c9212f}

/* Suggestions */
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:-5px 0 15px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid #4a5a70;background:transparent;color:#d5dde8;font-family:'Poppins',sans-serif;font-size:.85rem;cursor:pointer;transition:.2s}
.chip:hover,.chip:active{border-color:#e62e3c;color:#fff;background:rgba(230,46,60,.15)}

.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;margin-top:8px;background:#fff;color:#333;border:none;border-radius:12px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer;transition:.2s}
.google-btn:hover,.google-btn:active{background:#f1f1f1}
.error-msg{color:#ff4d4d;font-size:.85rem;text-align:center;margin-top:15px;display:none;background:rgba(255,77,77,.1);padding:10px;border-radius:8px}

.admin-panel{border:1px solid #4a5a70;background:#0d1b2a}
.admin-panel .modal-header h2{color:#e62e3c}
.admin-user{display:flex;align-items:center;gap:12px;padding:10px;background:#11223a;border-radius:12px;margin-bottom:15px;border:1px solid #2a3b52}
.admin-user strong{color:#fff;font-size:.9rem;display:block}
.admin-user small{color:#a0aec0;font-size:.75rem}
.admin-avatar{width:40px;height:40px;border-radius:50%;background:#e62e3c;object-fit:cover;flex-shrink:0}
.admin-list-title{color:#fff;font-size:.85rem;margin:25px 0 10px;text-align:left;border-bottom:1px solid #4a5a70;padding-bottom:5px}
.admin-link-item{display:flex;justify-content:space-between;align-items:center;background:#11223a;padding:10px 12px;border-radius:8px;margin-bottom:8px;border-left:3px solid #e62e3c}
.admin-link-item.hidden-link{opacity:.5;border-left-color:#4a5a70}
.admin-link-info{text-align:left;flex-grow:1;overflow:hidden}
.admin-link-info strong{color:#fff;font-size:.9rem;display:block}
.admin-link-info small{color:#a0aec0;font-size:.75rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-btn{background:transparent;border:none;cursor:pointer;font-size:1.2rem;margin-left:6px;padding:5px;transition:transform .2s}
.action-btn:hover,.action-btn:active{transform:scale(1.15)}
.logout-btn,.reset-btn,.seed-btn,.test-api-btn{width:100%;padding:12px;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;transition:.3s;font-size:.9rem;background:transparent;margin-top:15px}
.test-api-btn{color:#9b59b6;border:1px solid #9b59b6}.test-api-btn:hover{background:#9b59b6;color:#fff}
.seed-btn{color:#4CAF50;border:1px solid #4CAF50}.seed-btn:hover{background:#4CAF50;color:#fff}
.reset-btn{color:#f39c12;border:1px solid #f39c12}.reset-btn:hover{background:#f39c12;color:#fff}
.logout-btn{color:#ff4d4d;border:1px solid #ff4d4d;margin-top:10px}.logout-btn:hover{background:#ff4d4d;color:#fff}

.loading-state{text-align:center;padding:30px 10px}
.loading-state p{color:#a0aec0;font-size:.85rem;margin-top:15px}
.spinner{width:36px;height:36px;margin:0 auto;border:3px solid #2a3b52;border-top-color:#e62e3c;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{color:#a0aec0;font-size:.85rem;text-align:center;padding:20px 10px;background:#11223a;border-radius:8px}
.config-warning{position:fixed;top:0;left:0;right:0;z-index:9999999;background:#f39c12;color:#1a1a1a;text-align:center;font-size:.8rem;padding:8px 12px;font-weight:500}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#11223a;color:#fff;border:1px solid #2a3b52;padding:12px 20px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:99999999;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:#ff4d4d;color:#ff9a9a}

@media (max-width:480px){
  .landing-logo{max-width:180px;margin-bottom:40px}
  .single-btn{padding:18px 40px;font-size:1rem;width:100%}
  .modal-content{padding:25px 20px;max-height:90vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="configWarning" class="config-warning" style="display:none;">⚠️ Firebase not configured — running in <strong>demo mode</strong>.</div>

<div class="landing-wrapper">
    <img src="logo.png" alt="AHK Enterprise Logo" class="landing-logo" id="secretLogo" draggable="false">
    <div class="logo-fallback" id="logoFallback" role="img" aria-label="AHK Enterprise">AHK</div>
    <button id="openOptionsBtn" class="single-btn">Enter</button>
</div>

<!-- Search & open -->
<div id="optionsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="optTitle">
    <div class="modal-content">
        <button class="close-btn" id="closeOptions" aria-label="Close">&times;</button>
        <div class="modal-header">
            <h2 id="optTitle">Open App</h2>
            <p>Type the app name or pick one</p>
        </div>
        <div class="admin-input-group">
            <input type="text" id="searchAppInput" placeholder="e.g., Mi Gym App" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="suggestions" id="suggestions"></div>
        <button class="add-btn" id="searchOpenBtn">Open Now</button>
        <p id="searchError" class="error-msg"></p>
    </div>
</div>

<!-- Admin -->
<div id="adminModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content admin-panel">
        <button class="close-btn" id="closeAdmin" aria-label="Close">&times;</button>

        <div id="authLoading" class="loading-state" style="display:none;">
            <div class="spinner"></div><p>Signing you in…</p>
        </div>

        <div id="authSection">
            <div class="modal-header"><h2>🔒 Admin Access</h2><p>Sign in with your Google account.</p></div>
            <button id="googleSignInBtn" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
            <p id="authError" class="error-msg"></p>
        </div>

        <div id="adminContentSection" style="display:none;">
            <div class="admin-user">
                <img id="adminAvatar" class="admin-avatar" alt="Admin">
                <div><strong id="adminName">Admin</strong><small id="adminEmailDisplay">—</small></div>
            </div>
            <div class="modal-header"><h2>⚙️ Admin Panel</h2><p>Manage apps &amp; visibility</p></div>
            <div class="admin-input-group">
                <label for="newLinkName">Display name (exact name people type)</label>
                <input type="text" id="newLinkName" placeholder="e.g., New App" autocomplete="off">
            </div>
            <div class="admin-input-group">
                <label for="newLinkUrl">Folder path or URL</label>
                <input type="text" id="newLinkUrl" placeholder="e.g., newapp/index.html" autocomplete="off" autocapitalize="off">
            </div>
            <button class="add-btn" id="addLinkBtn">+ Add App</button>

            <div class="admin-list-title">App list (✏️ Edit / 👁️ Hide / 🗑️ Remove)</div>
            <div id="adminLinksList"></div>

            <button class="test-api-btn" id="testApiBtn">🔐 Test Secure API (px.js)</button>
            <button class="seed-btn" id="seedBtn" style="display:none;">🌱 Seed Default Apps</button>
            <button class="reset-btn" id="resetBtn">⚠️ Reset Everything</button>
            <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut as fbSignOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, updateDoc,
  onSnapshot, query, where, orderBy, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyDXG4MmHYKd5VRC3XZy4qOpcEfQV-iJDkY",
  authDomain:        "apponsale-c11f3.firebaseapp.com",
  projectId:         "apponsale-c11f3",
  storageBucket:     "apponsale-c11f3.firebasestorage.app",
  messagingSenderId: "701953325146",
  appId:             "1:701953325146:web:82d8dd70db61be07108063",
  measurementId:     "G-H3SWJ1ECME"
};

const SUPERADMIN_EMAIL = "cupncare@gmail.com";
const APP_COLLECTION   = "apps";
const CACHE_KEY        = 'ahkVisibleCache';

const defaultLinks = [
  { name: "Cup N Care",         url: "cupncare/index.html",  visible: true },
  { name: "AHK Wellness",       url: "ahk/index.html",       visible: true },
  { name: "Abdul Hameed Kunhi", url: "ahk/index.html",       visible: true },
  { name: "Mi Gym App",         url: "migym/index.html",     visible: true },
  { name: "Profile Mi",         url: "profilemi/index.html", visible: true }
];
const withIds = list => list.map((d, i) => ({ id: String(i + 1), ...d }));

const isConfigured = !Object.values(firebaseConfig).some(v => !v || String(v).includes('PASTE'));

let auth = null, db = null, provider = null;
if (isConfigured) {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db   = getFirestore(fbApp);
  setPersistence(auth, browserLocalPersistence).catch(console.error);
  provider = new GoogleAuthProvider();
  provider.addScope('email');
  provider.addScope('profile');
  provider.setCustomParameters({ prompt: 'select_account' });
} else {
  document.getElementById('configWarning').style.display = 'block';
}

const $ = id => document.getElementById(id);

/* ---------- Helpers ---------- */
function getUserEmail(user) {
  if (!user) return null;
  if (user.email) return user.email.toLowerCase();
  for (const p of user.providerData || []) if (p.email) return p.email.toLowerCase();
  const raw = user.reloadUserInfo && user.reloadUserInfo.email;
  if (raw) return String(raw).toLowerCase();
  return null;
}
const isAdminEmail = e => !!e && e === SUPERADMIN_EMAIL.toLowerCase();

let toastTimer;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* Accept "folder/index.html", "/folder/", or "https://..." — reject anything else */
function normalizeUrl(raw) {
  const v = String(raw || '').trim();
  if (!v || v.startsWith('//')) return null;
  try {
    const u = new URL(v, window.location.href);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? v : null;
  } catch { return null; }
}
function safeNavigate(rawUrl) {
  const v = normalizeUrl(rawUrl);
  if (!v) return false;
  window.location.href = new URL(v, window.location.href).href;
  return true;
}

/* ---------- Data layer ---------- */
const AppStore = {
  _localKey: 'ahkLinksData',
  _readLocal() {
    try {
      const raw = JSON.parse(localStorage.getItem(this._localKey) || 'null');
      if (Array.isArray(raw)) return raw;
    } catch {}
    return withIds(defaultLinks);
  },
  _writeLocal(list) { try { localStorage.setItem(this._localKey, JSON.stringify(list)); } catch {} },

  async getVisibleApps() {
    if (!isConfigured) return this._readLocal().filter(a => a.visible);
    try {
      const snap = await getDocs(query(collection(db, APP_COLLECTION), where('visible', '==', true)));
      const apps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (apps.length) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(apps)); } catch {}
        return apps;
      }
    } catch (e) { console.warn("Firestore read failed, using cache/defaults:", e); }
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (Array.isArray(cached) && cached.length) return cached;
    } catch {}
    return withIds(defaultLinks).filter(a => a.visible);
  },

  subscribeAll(cb, errCb) {
    if (!isConfigured) { cb(this._readLocal()); return () => {}; }
    return onSnapshot(
      query(collection(db, APP_COLLECTION), orderBy('createdAt', 'asc')),
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))), errCb);
  },

  async addApp(name, url) {
    if (!isConfigured) {
      const l = this._readLocal(); l.push({ id: Date.now().toString(), name, url, visible: true });
      return this._writeLocal(l);
    }
    await setDoc(doc(collection(db, APP_COLLECTION)), { name, url, visible: true, createdAt: Date.now() });
  },
  async updateApp(id, fields) {
    if (!isConfigured) {
      const l = this._readLocal(); const it = l.find(a => String(a.id) === String(id));
      if (it) Object.assign(it, fields); return this._writeLocal(l);
    }
    await updateDoc(doc(db, APP_COLLECTION, id), fields);
  },
  async deleteApp(id) {
    if (!isConfigured) return this._writeLocal(this._readLocal().filter(a => String(a.id) !== String(id)));
    await deleteDoc(doc(db, APP_COLLECTION, id));
  },
  async seedDefaults() {
    if (!isConfigured) return this._writeLocal(withIds(defaultLinks));
    const batch = writeBatch(db);
    const now = Date.now();
    defaultLinks.forEach((d, i) => batch.set(doc(collection(db, APP_COLLECTION)), { ...d, createdAt: now + i }));
    await batch.commit();
  },
  async resetAll() {
    if (!isConfigured) return this.seedDefaults();
    const snap = await getDocs(collection(db, APP_COLLECTION));
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    await this.seedDefaults();
  }
};

/* ---------- Auth ---------- */
const AuthManager = {
  async signIn() {
    if (!isConfigured) throw new Error("Firebase is not configured.");
    let res;
    try {
      res = await signInWithPopup(auth, provider);
    } catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
        await signInWithRedirect(auth, provider);
        return null;
      }
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
        throw new Error("Sign-in was cancelled. Tap the button to try again.");
      }
      if (e.code === 'auth/unauthorized-domain') {
        throw new Error("This domain isn't authorized. Add it in Firebase Console → Authentication → Settings → Authorized domains.");
      }
      throw e;
    }
    const email = getUserEmail(res.user);
    if (!isAdminEmail(email)) {
      await fbSignOut(auth);
      throw new Error(`Access denied. "${email || 'Unknown'}" is not authorized.`);
    }
    return res.user;
  },
  signOut: async () => { if (isConfigured) await fbSignOut(auth); },
  onChange: cb => { if (isConfigured) onAuthStateChanged(auth, cb); }
};

/* ---------- Admin UI ---------- */
let adminAppsCache = [], adminUnsub = null;

function showLoginScreen(errText) {
  $('authLoading').style.display = 'none';
  $('authSection').style.display = 'block';
  $('adminContentSection').style.display = 'none';
  const el = $('authError');
  el.style.display = errText ? 'block' : 'none';
  if (errText) el.textContent = errText;
}

function showAdminPanel(user) {
  $('authLoading').style.display = 'none';
  $('authSection').style.display = 'none';
  $('adminContentSection').style.display = 'block';
  $('adminAvatar').src = user.photoURL || 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#e62e3c"/><text x="50" y="58" text-anchor="middle" fill="#fff" font-size="42" font-family="Arial">A</text></svg>');
  $('adminName').textContent = user.displayName || 'Admin';
  $('adminEmailDisplay').textContent = getUserEmail(user) || 'Admin';
  $('adminModal').style.display = 'flex';
  if (adminUnsub) adminUnsub();
  adminUnsub = AppStore.subscribeAll(
    apps => { adminAppsCache = apps; renderAdminList(); },
    err => { console.error(err); toast("Couldn't load apps: " + err.message, true); });
}

function handleAuthState(user) {
  if (!user) return showLoginScreen();
  const email = getUserEmail(user);
  if (isAdminEmail(email)) return showAdminPanel(user);
  showLoginScreen(email ? `Access denied. "${email}" is not authorized.` : "Could not read your Google email. Try again.");
  AuthManager.signOut().catch(() => {});
}

function iconBtn(cls, text, title, fn) {
  const b = document.createElement('button');
  b.className = 'action-btn ' + cls; b.textContent = text; b.title = title; b.setAttribute('aria-label', title);
  b.addEventListener('click', fn); return b;
}

function renderAdminList() {
  const list = $('adminLinksList');
  list.innerHTML = '';
  if (!adminAppsCache.length) {
    const p = document.createElement('p');
    p.className = 'empty-state';
    p.textContent = 'No apps yet. Add one above or seed the defaults below.';
    list.appendChild(p);
    $('seedBtn').style.display = 'block';
    return;
  }
  $('seedBtn').style.display = 'none';
  adminAppsCache.forEach(link => {
    const item = document.createElement('div');
    item.className = 'admin-link-item' + (link.visible ? '' : ' hidden-link');
    const info = document.createElement('div'); info.className = 'admin-link-info';
    const s = document.createElement('strong'); s.textContent = link.name;
    const sm = document.createElement('small'); sm.textContent = link.url;
    info.append(s, sm);
    item.append(info,
      iconBtn('', '✏️', 'Edit', () => handleEdit(link)),
      iconBtn('', link.visible ? '👁️' : '🙈', link.visible ? 'Hide' : 'Show', () => handleToggle(link)),
      iconBtn('', '🗑️', 'Delete', () => handleDelete(link)));
    list.appendChild(item);
  });
}

async function run(fn, okMsg, errPrefix) {
  try {
    await fn();
    if (!isConfigured) { adminAppsCache = AppStore._readLocal(); renderAdminList(); }
    if (okMsg) toast(okMsg);
  } catch (e) { toast(`${errPrefix}: ${e.message}`, true); }
}

const handleToggle = link => run(() => AppStore.updateApp(link.id, { visible: !link.visible }),
  link.visible ? 'Hidden' : 'Visible', "Couldn't update");

const handleDelete = link => confirm(`Remove "${link.name}" from the list?`) &&
  run(() => AppStore.deleteApp(link.id), 'Removed', "Couldn't remove");

function handleEdit(link) {
  const name = prompt('App name:', link.name);
  if (name === null) return;
  const url = prompt('Folder path or URL:', link.url);
  if (url === null) return;
  if (!name.trim() || !normalizeUrl(url)) return toast('Enter a name and a valid path or URL.', true);
  run(() => AppStore.updateApp(link.id, { name: name.trim(), url: url.trim() }), 'Saved', "Couldn't save");
}

async function handleAdd() {
  const name = $('newLinkName').value.trim(), url = $('newLinkUrl').value.trim();
  if (!name || !url) return toast('Fill in both fields.', true);
  if (!normalizeUrl(url)) return toast('That path or URL is not valid.', true);
  if (adminAppsCache.some(a => String(a.name).toLowerCase() === name.toLowerCase()))
    return toast(`"${name}" already exists.`, true);
  await run(() => AppStore.addApp(name, url), `Added "${name}"`, "Couldn't add");
  $('newLinkName').value = ''; $('newLinkUrl').value = '';
}

const handleReset = () => confirm("Reset all apps to defaults? This cannot be undone.") &&
  run(() => AppStore.resetAll(), 'Reset to defaults', 'Reset failed');
const handleSeed = () => run(() => AppStore.seedDefaults(), 'Defaults added', 'Seed failed');

async function handleLogout() {
  if (adminUnsub) { adminUnsub(); adminUnsub = null; }
  try { await AuthManager.signOut(); } catch {}
  showLoginScreen();
  $('adminModal').style.display = 'none';
}

async function handleGoogleSignIn() {
  $('authError').style.display = 'none';
  $('authSection').style.display = 'none';
  $('authLoading').style.display = 'block';
  try { await AuthManager.signIn(); }
  catch (e) { showLoginScreen(e.message || "Sign-in failed."); }
}

async function testSecureApi() {
  const btn = $('testApiBtn'), orig = btn.textContent;
  btn.textContent = "⏳ Connecting to px.js..."; btn.disabled = true;
  try {
    const r = await fetch('/.netlify/functions/px', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'test' })
    });
    const data = await r.json();
    alert(`✅ Backend response:\n\n${data.message}\n\nKey status: ${data.keyStatus}`);
  } catch (e) {
    console.error(e); toast("Couldn't reach the backend. Is this running on Netlify?", true);
  } finally { btn.textContent = orig; btn.disabled = false; }
}

/* ---------- Search & open ---------- */
const errEl = () => $('searchError');
function setSearchMsg(text, color) {
  const el = errEl(); el.textContent = text; el.style.color = color; el.style.display = text ? 'block' : 'none';
}

async function loadSuggestions() {
  const box = $('suggestions');
  box.innerHTML = '';
  const apps = await AppStore.getVisibleApps();
  const seen = new Set();
  apps.forEach(a => {
    const n = String(a.name || '').trim();
    if (!n || seen.has(n.toLowerCase())) return;
    seen.add(n.toLowerCase());
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = n;
    c.addEventListener('click', () => { $('searchAppInput').value = n; searchAndOpenApp(); });
    box.appendChild(c);
  });
}

async function searchAndOpenApp() {
  const raw = $('searchAppInput').value.trim();
  if (!raw) return setSearchMsg('Enter an app name.', '#ff4d4d');
  setSearchMsg('Searching…', '#a0aec0');
  try {
    const apps = await AppStore.getVisibleApps();
    const q = raw.toLowerCase();
    const target = apps.find(a => String(a.name || '').toLowerCase().trim() === q)
                || apps.find(a => String(a.name || '').toLowerCase().includes(q));
    if (!target) return setSearchMsg(`"${raw}" was not found. Check the spelling or pick one above.`, '#ff4d4d');
    setSearchMsg('', '');
    if (!safeNavigate(target.url)) setSearchMsg('This app has an invalid link. Ask the admin to fix it.', '#ff4d4d');
  } catch (e) {
    console.error(e);
    setSearchMsg('Search failed. Check your connection and try again.', '#ff4d4d');
  }
}

/* ---------- Wire up ---------- */
const optionsModal = $('optionsModal'), adminModal = $('adminModal');

function openOptions() {
  optionsModal.style.display = 'flex';
  setSearchMsg('', '');
  $('searchAppInput').value = '';
  loadSuggestions();
  setTimeout(() => $('searchAppInput').focus(), 100);
}
function openAdmin() { adminModal.style.display = 'flex'; }

$('openOptionsBtn').addEventListener('click', openOptions);
$('closeOptions').addEventListener('click', () => optionsModal.style.display = 'none');
$('closeAdmin').addEventListener('click', () => adminModal.style.display = 'none');
$('searchAppInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchAndOpenApp(); });
$('searchOpenBtn').addEventListener('click', searchAndOpenApp);
$('googleSignInBtn').addEventListener('click', handleGoogleSignIn);
$('addLinkBtn').addEventListener('click', handleAdd);
$('resetBtn').addEventListener('click', handleReset);
$('seedBtn').addEventListener('click', handleSeed);
$('logoutBtn').addEventListener('click', handleLogout);
$('testApiBtn').addEventListener('click', testSecureApi);
window.addEventListener('click', e => {
  if (e.target === optionsModal) optionsModal.style.display = 'none';
  if (e.target === adminModal) adminModal.style.display = 'none';
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { optionsModal.style.display = 'none'; adminModal.style.display = 'none'; }
});

/* Secret entry: 5 taps on the logo (or text fallback), each within 2s of the last */
let tapCount = 0, tapTimer;
function secretTap() {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
  if (tapCount >= 5) { tapCount = 0; openAdmin(); }
}
$('secretLogo').addEventListener('click', secretTap);
$('logoFallback').addEventListener('click', secretTap);
$('secretLogo').addEventListener('error', () => {
  $('secretLogo').style.display = 'none';
  $('logoFallback').style.display = 'block';
});
/* Image may have failed before this script ran */
if ($('secretLogo').complete && $('secretLogo').naturalWidth === 0) $('secretLogo').dispatchEvent(new Event('error'));

/* Backup entry: yoursite.com/#admin */
function checkHash() { if (location.hash === '#admin') openAdmin(); }
window.addEventListener('hashchange', checkHash);
checkHash();

/* ---------- Bootstrap ---------- */
(async function bootstrap() {
  if (isConfigured) {
    try {
      const result = await getRedirectResult(auth);
      if (result && result.user) {
        const email = getUserEmail(result.user);
        openAdmin();
        if (!email) {
          const ids = (result.user.providerData || []).map(p => p.providerId).join(', ') || 'none';
          await fbSignOut(auth);
          showLoginScreen(`Google signed you in but did not share an email (providers: ${ids}). Please try again.`);
        } else if (!isAdminEmail(email)) {
          await fbSignOut(auth);
          showLoginScreen(`Access denied. "${email}" is not authorized.`);
        }
      }
    } catch (e) {
      console.error("Redirect result error:", e);
      openAdmin();
      showLoginScreen("Sign-in didn't complete: " + (e.message || e.code));
    }
    AuthManager.onChange(handleAuthState);
  } else {
    showAdminPanel({ email: "demo@example.com", displayName: 'Demo Admin', photoURL: '' });
    adminModal.style.display = 'none';
    adminAppsCache = AppStore._readLocal();
    renderAdminList();
  }
})();
</script>
</body>
