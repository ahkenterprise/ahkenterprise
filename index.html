function openModal(html,cls=''){$('#modalRoot').innerHTML=`<div class="ov" data-act="close-modal-bg"><div class="modal ${cls}">${html}</div></div>`;document.body.style.overflow='hidden';}
function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow='';}
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},2800);}
function confirmDialog({title,message,confirmText='Delete',danger=true,onConfirm}){openModal(`<div class="mh"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:${danger?'rgba(255,82,82,.12)':'rgba(198,255,61,.12)'};border:1px solid ${danger?'rgba(255,82,82,.3)':'rgba(198,255,61,.3)'};color:${danger?'var(--dgr)':'var(--acc)'};display:grid;place-items:center">${icon(danger?'ban':'check',17)}</div><div style="flex:1"><h3>${esc(title)}</h3></div><button class="ib" data-act="modal-close">${icon('x',16)}</button></div><div class="mb"><p style="color:var(--muted);font-size:13px;line-height:1.6">${message}</p></div><div class="mf"><button class="btn gho" data-act="modal-close">Cancel</button><button class="btn ${danger?'dgr':'acc'}" id="confirmYes">${esc(confirmText)}</button></div>`);$('#confirmYes').addEventListener('click',()=>{closeModal();onConfirm();});}
function imageUploaderHTML({id,label,preview,shape='square'}){const cls=preview?'ip has':'ip';return `<div class="fl full"><label>${esc(label)}</label><div class="iu"><div class="${cls}" id="prev-${id}">${preview?`<img src="${esc(preview)}"><button type="button" class="rm" data-act="img-clear" data-target="${id}">${icon('x',11)}</button>`:(shape==='logo'?'🏢':'🖼️')}</div><label class="ud" for="file-${id}">${icon('upload',18)}<div class="t">Upload</div><div class="s" style="font-size:11px;color:var(--muted)">Auto-compressed</div><input type="file" id="file-${id}" accept="image/*" data-img-target="${id}"></label></div></div>`;}
async function handleImageUpload(input,target,onDone){const file=input.files?.[0];if(!file)return;const prev=$('#prev-'+target);if(prev)prev.innerHTML='<div class="ld"></div>';try{const isLogo=target==='gym-logo';const r=await compressImage(file,{maxDim:isLogo?512:720,quality:isLogo?.85:.75,maxBytes:isLogo?150*1024:180*1024});if(prev)prev.innerHTML=`<img src="${r.dataUrl}"><button type="button" class="rm" data-act="img-clear" data-target="${target}">${icon('x',11)}</button>`;prev?.classList.add('has');onDone(r.dataUrl);}catch(err){if(prev)prev.innerHTML='🖼️';toast('Failed: '+err.message,'err');}}

function promoForm(promoId){const g=G();if(!g)return;const p=promoId?(g.promotions||[]).find(x=>x.id===promoId):null;const isE=!!p;const d=p||{title:'',desc:'',active:true};openModal(`<div class="mh"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:rgba(255,179,64,.12);border:1px solid rgba(255,179,64,.3);color:var(--wrn);display:grid;place-items:center">${icon('gift',17)}</div><div style="flex:1"><h3>${isE?'Edit':'Add'} Promotion</h3></div><button class="ib" data-act="modal-close">${icon('x',16)}</button></div><form id="promoForm" data-id="${p?p.id:''}"><div class="mb"><div class="fl" style="margin-bottom:12px"><label>Title *</label><input class="inp" name="title" required value="${esc(d.title)}" placeholder="e.g. New Year Special"></div><div class="fl" style="margin-bottom:12px"><label>Description</label><textarea class="inp" name="desc">${esc(d.desc)}</textarea></div><label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;padding:12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line2)"><input type="checkbox" name="active" ${d.active?'checked':''} style="width:16px;height:16px;accent-color:var(--acc)"><span>Show on landing page</span></label></div><div class="mf"><button type="button" class="btn gho" data-act="modal-close">Cancel</button><button type="submit" class="btn acc">${icon('check',14)} ${isE?'Save':'Add'}</button></div></form>`);$('#promoForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const data={title:f.get('title').trim(),desc:f.get('desc').trim(),active:f.get('active')==='on'};if(isE){Object.assign(p,data);}else{g.promotions=g.promotions||[];g.promotions.unshift({id:uid(),createdAt:today(),...data});}saveGym(g.id);closeModal();render();toast(isE?'Updated':'Added');});}

function viewShopPreviewModal(gymId){const g=state.gyms.find(x=>x.id===gymId);if(!g)return;openModal(`<div class="mh"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);color:var(--acc);display:grid;place-items:center">${icon('box',17)}</div><div style="flex:1"><h3>${esc(g.name)} — Shop</h3><div class="sub">Register to buy</div></div><button class="ib" data-act="modal-close">${icon('x',16)}</button></div><div class="mb"><div class="prods" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${(g.products||[]).map(p=>`<div class="prod"><div class="pi" style="height:100px;font-size:38px">${p.image?`<img src="${esc(p.image)}">`:`<span>${p.emoji}</span>`}</div><div class="pb"><div class="pc">${esc(p.category)}</div><h3 style="font-size:13px">${esc(p.name)}</h3><div class="pf"><span class="price" style="font-size:15px">${money(p.price)}</span></div></div></div>`).join('')||'<div class="empty">No products</div>'}</div></div><div class="mf"><button class="btn gho" data-act="modal-close">Close</button><button class="btn acc" onclick="registerMemberPublic('${g.id}')">${icon('user',14)} Register to Buy</button></div>`,'lg');}

function gymForm(id){if(!isSA())return;const g=id?state.gyms.find(x=>x.id===id):null;const isE=!!g;const d=g||{name:'',city:'',address:'',phone:'',upiId:'',logo:null,emoji:GYM_EMOJIS[state.gyms.length%GYM_EMOJIS.length],color:GYM_COLORS[state.gyms.length%GYM_COLORS.length],ownerEmail:'',ownerUsername:'',ownerPhone:'',platformPlan:'monthly'};openModal(`<div class="mh"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);color:var(--acc);display:grid;place-items:center">${icon('building',17)}</div><div style="flex:1"><h3>${isE?'Edit':'Register'} Gym</h3></div><button class="ib" data-act="modal-close">${icon('x',16)}</button></div><form id="gymForm"><div class="mb"><div class="fg"><div class="fl full"><label>Gym Name *</label><input class="inp" name="name" required value="${esc(d.name)}"></div><div class="fl"><label>City</label><input class="inp" name="city" value="${esc(d.city)}"></div><div class="fl"><label>Phone</label><input class="inp" name="phone" value="${esc(d.phone)}"></div><div class="fl full"><label>Address</label><input class="inp" name="address" value="${esc(d.address)}"></div><div class="fl full"><label>UPI ID</label><input class="inp" name="upiId" value="${esc(d.upiId)}" placeholder="gym@upi"></div><div class="fl full"><label>Owner Email *</label><input class="inp" type="email" name="ownerEmail" required value="${esc(d.ownerEmail)}"></div><div class="fl full"><label>Owner User ID *</label><input class="inp" name="ownerUsername" required value="${esc(d.ownerUsername||'')}" placeholder="e.g. maingym"></div><div class="fl full"><label>Owner Phone *</label><input class="inp" name="ownerPhone" required value="${esc(d.ownerPhone)}" placeholder="+919876543210"></div><div class="fl full"><label>${isE?'New Password (blank = keep)':'Owner Password *'}</label><div class="pw"><input class="inp" type="password" name="password" id="gymPw" ${isE?'':'required'}><button type="button" class="pwt" data-act="toggle-pw" data-target="gymPw">${icon('eye',15)}</button></div></div>${imageUploaderHTML({id:'gym-logo',label:'Logo',preview:d.logo,shape:'logo'})}<input type="hidden" name="logo" value="${d.logo||''}"><div class="fl full"><label>Icon</label><div style="display:flex;gap:6px;flex-wrap:wrap" id="gymEmoji">${GYM_EMOJIS.map(e=>`<button type="button" data-emoji="${e}" style="width:36px;height:36px;border-radius:9px;background:var(--panel2);border:1px solid ${e===d.emoji?'var(--acc)':'var(--line2)'};font-size:18px">${e}</button>`).join('')}</div><input type="hidden" name="emoji" value="${esc(d.emoji)}"></div><div class="fl full"><label>Color</label><div style="display:flex;gap:6px;flex-wrap:wrap" id="gymColor">${GYM_COLORS.map(c=>`<button type="button" data-color="${c}" style="width:30px;height:30px;border-radius:8px;background:${c};border:2px solid ${c===d.color?'#fff':'transparent'}"></button>`).join('')}</div><input type="hidden" name="color" value="${esc(d.color)}"></div><div class="fl full"><label>Platform Plan *</label><div class="planpick" id="gymPlanPick">${GYM_PLAN_KEYS.map(k=>{const p=state.superadminPlans[k];return `<button type="button" data-plan="${k}" class="${(d.platformPlan||'monthly')===k?'on':''}" ${!p.enabled?'disabled':''}><span class="l">${esc(p.label)}</span><span class="v">${money(p.price)}</span><span class="s">${p.days} days</span></button>`;}).join('')}</div><input type="hidden" name="platformPlan" value="${d.platformPlan||'monthly'}"></div></div></div><div class="mf"><button type="button" class="btn gho" data-act="modal-close">Cancel</button><button type="submit" class="btn acc">${icon('check',14)} ${isE?'Save':'Register'}</button></div></form>`,'lg');$('#gymEmoji').addEventListener('click',e=>{const b=e.target.closest('[data-emoji]');if(!b)return;$$('#gymEmoji button').forEach(x=>x.style.borderColor='var(--line2)');b.style.borderColor='var(--acc)';$('[name="emoji"]').value=b.dataset.emoji;});$('#gymColor').addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(!b)return;$$('#gymColor button').forEach(x=>x.style.borderColor='transparent');b.style.borderColor='#fff';$('[name="color"]').value=b.dataset.color;});$('#gymPlanPick').addEventListener('click',e=>{const b=e.target.closest('[data-plan]');if(!b||b.disabled)return;$$('#gymPlanPick button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('[name="platformPlan"]').value=b.dataset.plan;});const fi=$('#file-gym-logo');if(fi)fi.addEventListener('change',()=>handleImageUpload(fi,'gym-logo',d=>{$('[name="logo"]').value=d;}));$('#gymForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const email=(f.get('ownerEmail')||'').trim().toLowerCase();const username=(f.get('ownerUsername')||'').trim().toLowerCase();const pw=String(f.get('password')||'');if(!isE&&pw.length<6){toast('Password min 6','err');return;}if(state.gyms.some(x=>x.id!==(isE?g.id:null)&&x.ownerEmail?.toLowerCase()===email)){toast('Email taken','err');return;}if(state.gyms.some(x=>x.id!==(isE?g.id:null)&&x.ownerUsername?.toLowerCase()===username)){toast('User ID taken','err');return;}const planKey=f.get('platformPlan')||'monthly';const planObj=state.superadminPlans[planKey];const data={name:f.get('name').trim(),city:f.get('city').trim(),address:f.get('address').trim(),phone:f.get('phone').trim(),upiId:(f.get('upiId')||'').trim(),ownerEmail:email,ownerUsername:username,ownerPhone:(f.get('ownerPhone')||'').trim(),emoji:f.get('emoji'),color:f.get('color'),logo:f.get('logo')||null,platformPlan:planKey,platformPlanExpires:addDays(today(),planObj.days)};if(isE){if(pw)data.ownerPasswordHash=hash(pw);Object.assign(g,data);toast('Updated');saveGym(g.id);}else{const ng=makeGym(data.name,data.city,state.gyms.length);Object.assign(ng,data,{ownerPasswordHash:hash(pw),approved:false});state.gyms.push(ng);notifySA(`New gym: ${ng.name} — Plan: ${planObj.label}. Awaiting approval.`);toast('Registered ✓','warn');saveGym(ng.id);}closeModal();render();});}
function approveGym(id){const g=state.gyms.find(x=>x.id===id);if(!g)return;g.approved=true;g.approvedAt=today();if(!g.platformPlanExpires)g.platformPlanExpires=addDays(today(),(state.superadminPlans[g.platformPlan||'monthly']||DEFAULT_GYM_PLANS.monthly).days);sendWhatsApp(g.ownerPhone,`Your gym "${g.name}" approved on MiGym! Plan: ${(state.superadminPlans[g.platformPlan||'monthly']||DEFAULT_GYM_PLANS.monthly).label}.`);notifySA(`Gym ${g.name} approved.`);saveGym(g.id);render();toast('Approved ✓');}

function registerGymPublic(){const enabledPlans = GYM_PLAN_KEYS.filter(k=>state.superadminPlans[k].enabled);if(!enabledPlans.length) { toast('No plans available — contact Superadmin','err'); return; }const defaultPlan = enabledPlans[0];const defaultPrice = state.superadminPlans[defaultPlan].price;openModal(`<div class="mh"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:var(--acc);color:#0b0d07;display:grid;place-items:center">${icon('building',17)}</div><div style="flex:1"><h3>Register Your Gym</h3><div class="sub">Pick a plan and pay to activate</div></div><button class="ib" data-act="modal-close">${icon('x',16)}</button></div><form id="pubGymForm"><div class="mb"><div class="fg"><div class="fl full"><label>Gym Name *</label><input class="inp" name="name" required></div><div class="fl full"><label>City *</label><input class="inp" name="city" required></div><div class="fl full"><label>Owner Email *</label><input class="inp" type="email" name="email" required></div><div class="fl full"><label>Owner User ID *</label><input class="inp" name="username" required></div><div class="fl full"><label>Owner Phone *</label><input class="inp" name="phone" required placeholder="+919876543210"></div><div class="fl full"><label>Password *</label><div class="pw"><input class="inp" type="password" name="password" id="pubPw" required minlength="6"><button type="button" class="pwt" data-act="toggle-pw" data-target="pubPw">${icon('eye',15)}</button></div></div></div><div class="fl full" style="margin-top:12px"><label>Choose Your Subscription Plan *</label><div class="planpick" id="pubPlanPick">${enabledPlans.map(k=>{const p=state.superadminPlans[k];return `<button type="button" data-plan="${k}" data-price="${p.price}" data-days="${p.days}" class="${k===defaultPlan?'on':''}"><span class="l">${esc(p.label)}</span><span class="v">${money(p.price)}</span><span class="s">${p.days} days</span></button>`;}).join('')}</div><input type="hidden" name="platformPlan" value="${defaultPlan}"></div><div class="upi-box" id="pubGymUpiBox"><div class="upi-box-header">${icon('dollar',14)} Platform Fee Payment</div><div class="upi-amount" id="pubGymFee">${money(defaultPrice)}</div><div class="upi-id">Pay to Superadmin: <strong>${SUPER_UPI_ID}</strong></div><div class="upi-apps"><a class="upi-btn" id="pubUpi1" href="upi://pay?pa=${encodeURIComponent(SUPER_UPI_ID)}&pn=MiGym&am=${defaultPrice}&cu=INR&tn=Gym Registration"><div class="ico">📱</div><div>Any UPI</div></a><a class="upi-btn" id="pubUpi2" href="gpay://upi/pay?pa=${encodeURIComponent(SUPER_UPI_ID)}&pn=MiGym&am=${defaultPrice}&cu=INR&tn=Gym Registration"><div class="ico">🟢</div><div>GPay</div></a><a class="upi-btn" id="pubUpi3" href="phonepe://pay?pa=${encodeURIComponent(SUPER_UPI_ID)}&pn=MiGym&am=${defaultPrice}&cu=INR&tn=Gym Registration"><div class="ico">🟣</div><span>PhonePe</span></a></div><label class="paid-check"><input type="checkbox" name="paidCheck" id="gymPaidCheck" required><span>I have completed the payment</span></label></div></div><div class="mf"><button type="button" class="btn gho" data-act="modal-close">Cancel</button><button type="submit" class="btn acc">${icon('check',14)} Submit</button></div></form>`,'lg');$('#pubPlanPick').addEventListener('click', e => {const b = e.target.closest('[data-plan]'); if(!b) return;$$('#pubPlanPick button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const plan = b.dataset.plan, price = parseFloat(b.dataset.price)||0;$('[name="platformPlan"]').value = plan;$('#pubGymFee').textContent = money(price);const upiStr = `pa=${encodeURIComponent(SUPER_UPI_ID)}&pn=MiGym&am=${price}&cu=INR&tn=${encodeURIComponent('Gym Registration — '+plan)}`;$('#pubUpi1').href = `upi://pay?${upiStr}`;$('#pubUpi2').href = `gpay://upi/pay?${upiStr}`;$('#pubUpi3').href = `phonepe://pay?${upiStr}`;});$('#pubGymForm').addEventListener('submit',async e=>{e.preventDefault();if(!$('#gymPaidCheck').checked) { toast('Payment is mandatory to complete registration', 'err'); return; }const f=new FormData(e.target);const email=(f.get('email')||'').trim().toLowerCase();const username=(f.get('username')||'').trim().toLowerCase();if(state.gyms.some(x=>x.ownerEmail?.toLowerCase()===email)){toast('Email taken','err');return;}if(state.gyms.some(x=>x.ownerUsername?.toLowerCase()===username)){toast('User ID taken','err');return;}const planKey = f.get('platformPlan')||'monthly';const planObj = state.superadminPlans[planKey];const ng=makeGym(f.get('name').trim(),f.get('city').trim(),state.gyms.length);ng.ownerEmail=email; ng.ownerUsername=username; ng.ownerPhone=(f.get('phone')||'').trim();ng.ownerPasswordHash=hash(f.get('password'));ng.approved=false;ng.platformPlan = planKey;ng.platformPlanExpires = addDays(today(), planObj.days);ng.platformPayment = { date: today(), amount: planObj.price, method: 'UPI', status: 'paid', plan: planKey };state.gyms.push(ng);notifySA(`New gym: "${ng.name}" in ${ng.city}. Plan: ${planObj.label} — ${money(planObj.price)} paid. Awaiting approval.`);await saveGym(ng.id);closeModal();toast('Registration submitted ✓');setTimeout(()=>openModal(`<div class="mh"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:rgba(61,220,151,.15);border:1px solid rgba(61,220,151,.35);color:var(--grn);display:grid;place-items:center">${icon('check',17)}</div><div style="flex:1"><h3>Submitted</h3></div></div><div class="mb"><p style="font-size:13px;color:var(--muted);line-height:1.6">Your registration and payment (${money(planObj.price)} — ${planObj.label}) have been received. You'll be notified via WhatsApp once the superadmin approves your account.</p><div class="div"></div><div style="font-size:12.5px;color:var(--muted)">Log in later with <strong>${esc(email)}</strong> or <strong>${esc(username)}</strong>.</div></div><div class="mf"><button class="btn acc" data-act="modal-close">OK</button></div>`),300);});}

function registerMemberPublic(gymId, prefilledRef=null){
  const gym=gymId?state.gyms.find(x=>x.id===gymId):state.gyms.find(x=>x.approved);
  if(!gym){toast('No gym found','err');return;}
  const mp = {...DEFAULT_MEMBER_PLANS, ...(gym.memberPlans||{})};
  const refCode = prefilledRef || state.pendingRefCode;
  const refOwner = refCode ? gym.members.find(m=>m.code===refCode) : null;
  
  const getGymUpi = (gm) => {
      if (gm.upiId && gm.upiId.includes('@')) return gm.upiId;
      if (gm.phone) { const digits = gm.phone.replace(/\D/g, ''); if (digits.length >= 10) return digits.slice(-10) + '@upi'; }
      if (gm.ownerPhone) { const digits = gm.ownerPhone.replace(/\D/g, ''); if (digits.length >= 10) return digits.slice(-10) + '@upi'; }
      return '';
  };
  let currentGymUpi = getGymUpi(gym);
  
  const activePromos = (gym.promotions||[]).filter(p=>p.active);
  const socialLinks = socialsList(gym);
  
  openModal(`
    <div class="mh"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:var(--acc);color:#0b0d07;display:grid;place-items:center">${icon('user',17)}</div><div style="flex:1"><h3>Register as Member</h3><div class="sub">${esc(gym.name)}</div></div><button class="ib" data-act="modal-close">${icon('x',16)}</button></div>
    <form id="pubMemberForm">
      <div class="mb">
        ${refCode?`<div class="ref-banner" style="margin-bottom:14px"><div class="ic">${icon('gift',18)}</div><div class="body">Referred by <b>${esc(refOwner?refOwner.name:'a member')}</b> with code <b>${esc(refCode)}</b>${refOwner?'':' — ask them for the discount details'}.</div></div>`:''}
        ${activePromos.length?`<div style="margin-bottom:14px">${activePromos.map(p=>`<div class="promo-banner" style="margin-bottom:8px"><div class="ic">🎉</div><div class="body"><div class="t">${esc(p.title)}</div><div class="d">${esc(p.desc)}</div></div></div>`).join('')}</div>`:''}
        <div class="fg">
          <div class="fl full"><label>Gym *</label><select class="inp" name="gymId" id="regGymSel">${state.gyms.filter(g=>g.approved).map(g=>`<option value="${g.id}" ${g.id===gym.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>
          <div class="fl full"><label>Full Name *</label><input class="inp" name="name" required></div>
          <div class="fl full"><label>Email *</label><input class="inp" type="email" name="email" required></div>
          <div class="fl full"><label>Phone *</label><input class="inp" name="phone" required></div>
          ${imageUploaderHTML({id:'member-profile', label:'Profile Picture (Optional)', preview:null})}
          <input type="hidden" name="profileImage" value="">
          <div class="fl"><label>Age</label><input class="inp" type="number" name="age" value="25"></div>
          <div class="fl"><label>Weight (kg)</label><input class="inp" type="number" name="weight" value="70"></div>
          <div class="fl"><label>Gender</label><select class="inp" name="gender"><option value="male">Male</option><option value="female">Female</option></select></div>
          <div class="fl"><label>Height (cm)</label><input class="inp" type="number" name="height" value="170"></div>
          <div class="fl full"><label>Plan *</label><select class="inp" name="plan" id="regPlanSel">${PLAN_KEYS.map(k=>`<option value="${k}" data-price="${mp[k].price}">${mp[k].label} — ${money(mp[k].price)}</option>`).join('')}</select></div>
          ${refCode?`<div class="fl full"><label>Referral Code</label><input class="inp" name="refCode" value="${esc(refCode)}" readonly></div>`:''}
          <div class="fl full"><label>User ID *</label><input class="inp" name="username" required></div>
          <div class="fl full"><label>Password *</label><div class="pw"><input class="inp" type="password" name="password" id="pubMemPw" required minlength="6"><button type="button" class="pwt" data-act="toggle-pw" data-target="pubMemPw">${icon('eye',15)}</button></div></div>
        </div>
        <div class="upi-box" id="regUpiBox">
          <div class="upi-box-header">${icon('dollar',14)} Payment Required</div>
          <div class="upi-amount" id="regUpiAmount">${money(mp.monthly.price)}</div>
          <div class="upi-id" id="regUpiIdText">Pay to Gym: <strong>${currentGymUpi ? esc(currentGymUpi) : 'Pay at Gym'}</strong></div>
          ${currentGymUpi ? `
            <div class="upi-apps" id="regUpiApps">
              <a class="upi-btn" href="#" onclick="window.openUpiLink(this, event)"><div class="ico">📱</div><div>Any UPI</div></a>
              <a class="upi-btn" href="#" onclick="window.openUpiLink(this, event)"><div class="ico">🟢</div><div>GPay</div></a>
              <a class="upi-btn" href="#" onclick="window.openUpiLink(this, event)"><div class="ico">🟣</div><div>PhonePe</div></a>
            </div>
            <label class="paid-check"><input type="checkbox" name="paidCheck" id="regPaidCheck" required><span>I have completed the UPI payment</span></label>
          ` : `
            <label class="paid-check" style="background:rgba(255,179,64,0.1);border-color:rgba(255,179,64,0.3)"><input type="checkbox" name="paidCheck" id="regPaidCheck" required><span style="color:#ffc163">I agree to pay at the gym</span></label>

  case 'member-edit':closeModal();setTimeout(()=>memberForm(id),50);break;
  case 'member-open':closeModal();openMemberDetail(id);break;
  case 'member-approve':approveMember(id);if($('#modalRoot').innerHTML.includes('tabs'))renderDetail();break;
  case 'member-face-enroll':faceEnroll(id);if($('#modalRoot').innerHTML.includes('tabs'))closeModal();break;
  case 'member-door-on':doorOn(id);if($('#modalRoot').innerHTML.includes('tabs'))renderDetail();break;
  case 'member-door-off':doorOff(id);if($('#modalRoot').innerHTML.includes('tabs'))renderDetail();break;
  case 'member-renew':renewMember(id);if($('#modalRoot').innerHTML.includes('tabs'))renderDetail();break;
  case 'member-del':{const g=G();const m=g.members.find(x=>x.id===id);if(!m)break;confirmDialog({title:'Delete',message:`Delete ${esc(m.name)}?`,confirmText:'Delete',onConfirm(){g.members=g.members.filter(x=>x.id!==id);saveGym(g.id);render();toast('Deleted','err');}});break;}
  case 'product-add':productForm();break;
  case 'product-edit':closeModal();setTimeout(()=>productForm(id),50);break;
  case 'product-del':{const g=G();const p=g.products.find(x=>x.id===id);if(!p)break;confirmDialog({title:'Delete',message:`Delete ${esc(p.name)}?`,confirmText:'Delete',onConfirm(){g.products=g.products.filter(x=>x.id!==id);saveGym(g.id);render();toast('Deleted','err');}});break;}
  case 'promo-add':promoForm();break;
  case 'promo-edit':closeModal();setTimeout(()=>promoForm(id),50);break;
  case 'promo-del':{const g=G();if(!g)break;confirmDialog({title:'Delete promo',message:'Remove this promotion?',confirmText:'Delete',onConfirm(){g.promotions=(g.promotions||[]).filter(x=>x.id!==id);saveGym(g.id);render();toast('Deleted','err');}});break;}
  case 'preview-shop':viewShopPreviewModal(id);break;
  case 'native-share':{const url=el.dataset.url;const title=el.dataset.title||'MiGym';const text=el.dataset.text||'';if(navigator.share){try{await navigator.share({title,text,url});}catch(err){if(err.name!=='AbortError'){try{await navigator.clipboard.writeText(url);toast('Link copied');}catch(e){toast('Share failed','err');}}}}else{try{await navigator.clipboard.writeText(url);toast('Link copied to clipboard');}catch(err){toast('Copy failed','err');}}break;}
  case 'face-test':{const g=G();if(!g)break;toast('Testing…','warn');setTimeout(()=>{g.faceDevice.connected=true;g.faceDevice.lastSync=today();g.syncLog=g.syncLog||[];g.syncLog.unshift({id:uid(),date:today(),ok:true,msg:'Connection successful'});saveGym(g.id);render();toast('Reachable ✓');},900);break;}
  case 'face-sync':{const g=G();if(!g)break;const en=g.members.filter(m=>m.faceEnrolled);g.faceDevice.lastSync=today();g.faceDevice.connected=true;g.syncLog=g.syncLog||[];g.syncLog.unshift({id:uid(),date:today(),ok:true,msg:`Synced ${en.length} members`});saveGym(g.id);render();toast(`Synced ${en.length} ✓`);break;}
  case 'mark-all-read':{if(isSA()){state.gyms.forEach(g=>{(g.notifications||[]).forEach(n=>n.read=true);saveGym(g.id);});}else{const g=G();(g.notifications||[]).forEach(n=>n.read=true);saveGym(g.id);}render();break;}
  case 'run-sweep':{const changed=sweepExpirations();render();toast(changed?'Sweep complete — some items updated':'Nothing to sweep','');break;}
  case 'cart-add':{const g=G();const p=g.products.find(x=>x.id===id);if(!p)break;const ec=state.cart.find(c=>c.productId===id);if(ec)ec.qty++;else state.cart.push({productId:id,qty:1});toast(`${p.name} added`);render();break;}
  case 'cart-inc':{const c=state.cart.find(x=>x.productId===id);if(c)c.qty++;render();break;}
  case 'cart-dec':{const c=state.cart.find(x=>x.productId===id);if(!c)break;c.qty--;if(c.qty<=0)state.cart=state.cart.filter(x=>x.productId!==id);render();break;}
  case 'cart-clear':state.cart=[];render();break;
  case 'mark-paid':{const g=G();const m=me();if(!g||!m)break;const amount=parseFloat(el.dataset.amount)||0;const note=el.dataset.note||'Payment';m.payments=m.payments||[];m.payments.push({id:uid(),date:today(),amount,method:'UPI',note,status:'pending'});if(m.status==='expired'){m.status='active';m.approvalStatus=m.faceEnrolled?'approved':'face_pending';m.endDate=addDays(today(),(gymPlans()[m.plan]||{days:30}).days);if(m.faceEnrolled&&m.approvalStatus==='approved'){m.doorAccess=true;}notifyGym(g,'whatsapp',g.ownerPhone||'admin',`${m.name} paid ${money(amount)}. Renewed until ${fmtDate(m.endDate)}.`);}notifyGym(g,'sms',g.ownerPhone||'admin',`${m.name} paid ${money(amount)} (${note}).`);saveGym(g.id);toast('Recorded ✓ — awaiting gym approval');render();break;}
  case 'copy':{try{await navigator.clipboard.writeText(el.dataset.copy);toast('Copied!');}catch(err){toast('Failed','err');}break;}
  case 'img-clear':{e.stopPropagation();const t=el.dataset.target;const prev=$('#prev-'+t);if(prev){prev.className='ip';prev.innerHTML=t==='gym-logo'?'🏢':'🖼️';}const form=el.closest('form');if(form){const h=form.querySelector(`[name="${t==='gym-logo'?'logo':'image'}"]`);if(h)h.value='';}const fi=$('#file-'+t);if(fi)fi.value='';break;}
  case 'ai-save':{const p=$('#aiProvider').value;const k=$('#aiKey').value.trim();if(!k){toast('Key required','err');break;}state.ai={provider:p,apiKey:k,model:p!=='custom'?CANONICAL_MODELS[p]:($('#aiModel')?.value.trim()||'gpt-3.5-turbo'),customUrl:$('#aiCustomUrl')?.value.trim()||''};saveAI();toast('Saved ✓');render();break;}
  case 'ai-test':{const p=$('#aiProvider').value;const k=$('#aiKey').value.trim();if(!k){toast('Key required','err');break;}state.ai={provider:p,apiKey:k,model:p!=='custom'?CANONICAL_MODELS[p]:($('#aiModel')?.value.trim()||'gpt-3.5-turbo'),customUrl:$('#aiCustomUrl')?.value.trim()||''};const area=$('#aiTestResult');if(area)area.innerHTML=`<div class="ai-insight"><div class="ai-insight-head">${icon('sparkle',13)} Testing…</div></div>`;try{const r=await askAI('Reply with exactly OK','test');saveAI();if(area)area.innerHTML=`<div class="ai-insight" style="border-color:rgba(61,220,151,.35)"><div class="ai-insight-head" style="color:#4fe3a4">${icon('check',13)} Success</div><div class="ai-insight-body">${esc(r.slice(0,80))}</div></div>`;toast('Works ✓');}catch(err){if(area)area.innerHTML=`<div class="ai-insight" style="border-color:rgba(255,82,82,.4)"><div class="ai-insight-head" style="color:#ff9090">${icon('ban',13)} Failed</div><div class="ai-insight-body">${esc(err.message)}</div></div>`;toast('Failed','err');}break;}
  case 'ai-insight':aiInsight(id);break;
  case 'ai-referral-msg':{const g=G();const m=me();if(!g||!m)break;const s=gymSettings();const area=$('#aiMarketingArea');if(area)area.innerHTML=`<div class="ai-insight"><div class="ai-insight-head">${icon('sparkle',13)} Generating…</div></div>`;try{const refUrl=gymShareUrl(g.id,m.code);const txt=await askAI('Friendly WhatsApp invite under 60 words with link','Invite friends to '+g.name+'. My code: '+m.code+'. Link: '+refUrl+'. They get '+s.discount+'% off.');if(area)area.innerHTML=`<div class="ai-insight"><div class="ai-insight-head">${icon('sparkle',13)} Message</div><div class="ai-insight-body">${esc(txt)}</div><div style="margin-top:8px"><button class="btn sm ai" data-act="copy" data-copy="${esc(txt)}">${icon('copy',12)} Copy</button></div></div>`;}catch(err){if(area)area.innerHTML=`<div class="ai-insight" style="border-color:rgba(255,82,82,.4)"><div class="ai-insight-body">${esc(err.message)}</div></div>`;}break;}
  case 'chat-send':sendChat();break;
  case 'chat-suggest':sendChat(el.dataset.q);break;
  case 'chat-clear':state.aiChat=[];render();break;
  case 'gym-admin-login':openGymAdminLogin(id);break;
  case 'open-video':{const url=el.dataset.url;openModal(`<div class="fs-media"><button class="close-btn" data-act="modal-close">${icon('x',24)}</button><div class="media-content"><iframe src="${url}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe><button class="next-btn" data-act="modal-close">Next</button></div></div>`);break;}
  case 'open-image':{const url=el.dataset.url;openModal(`<div class="fs-media"><button class="close-btn" data-act="modal-close">${icon('x',24)}</button><div class="media-content" data-act="modal-close"><img src="${url}" class="full-img"><button class="next-btn" data-act="modal-close">Next</button></div></div>`);break;}
  case 'gallery-del':{const g=G();if(!g)return;const idx=parseInt(el.dataset.idx);g.gallery=g.gallery.filter((_,i)=>i!==idx);saveGym(g.id);render();toast('Photo removed');break;}
}});
document.addEventListener('input',e=>{if(e.target.id==='memberSearch'){state.query=e.target.value;const pos=e.target.selectionStart;render();const i=$('#memberSearch');if(i){i.focus();i.setSelectionRange(pos,pos);}}});
document.addEventListener('change',e=>{if(e.target.id==='aiProvider'){const p=e.target.value;if(p!=='custom'&&CANONICAL_MODELS[p]){const mi=$('#aiModel');if(mi){mi.value=CANONICAL_MODELS[p];mi.readOnly=true;mi.style.opacity='.7';}}render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='chatInput'&&!e.shiftKey){e.preventDefault();sendChat();}});
document.addEventListener('submit',e=>{
  const t=e.target.id;
  if(t==='platformPlansForm'){e.preventDefault();const f=new FormData(e.target);GYM_PLAN_KEYS.forEach(k=>{state.superadminPlans[k]={...state.superadminPlans[k],price:parseFloat(f.get('price_'+k))||0,days:parseInt(f.get('days_'+k))||30,enabled:f.get('en_'+k)==='on'};});saveConfig();toast('Platform plans updated ✓');render();return;}
  if(t==='memberPlansForm'){e.preventDefault();const g=G();if(!g)return;const f=new FormData(e.target);PLAN_KEYS.forEach(k=>{g.memberPlans[k]={...g.memberPlans[k],price:parseFloat(f.get('price_'+k))||0,days:parseInt(f.get('days_'+k))||30};});saveGym(g.id);toast('Member plans updated ✓');render();return;}
  if(t==='gymAdminLoginForm'){e.preventDefault();const f = new FormData(e.target);const gid = e.target.dataset.gymid;const identifier = f.get('identifier').trim().toLowerCase();const pw = f.get('password');const gym = state.gyms.find(x => x.id === gid);if (!gym) return;if ((gym.ownerEmail?.toLowerCase() === identifier || gym.ownerUsername?.toLowerCase() === identifier) && gym.ownerPasswordHash === hash(pw)) {if (gym.status === 'blocked') { const err=$('#gymAdminLoginError'); if(err){err.textContent='This gym is blocked.'; err.style.display='flex';} return; }if (gym.status === 'expired') { const err=$('#gymAdminLoginError'); if(err){err.textContent='Gym platform plan expired. Contact Superadmin.'; err.style.display='flex';} return; }if (!gym.approved) { const err=$('#gymAdminLoginError'); if(err){err.textContent='Gym not yet approved.'; err.style.display='flex';} return; }closeModal();state.auth = { role: 'gymowner', email: gym.ownerEmail, gymId: gym.id, memberId: null };state.route = 'dashboard';state.currentGymId = gym.id;state.cart = [];state.publicGymId = null; state.publicGymMode = 'landing';saveAuth();render();toast('Welcome back!');} else {const err = $('#gymAdminLoginError');if(err) { err.textContent = 'Invalid credentials'; err.style.display = 'flex'; }}return;}
  if(t==='gymMemberLoginForm'){e.preventDefault();const f=new FormData(e.target);const gid=e.target.dataset.gymid;const g=state.gyms.find(x=>x.id===gid);if(!g) return;const uname=f.get('username').trim().toLowerCase();const pass=f.get('password');const m=g.members.find(x=>(x.username?.toLowerCase()===uname || x.email?.toLowerCase()===uname) && x.passwordHash===hash(pass));if(m){if(m.status==='blocked'){ const err=$('#gymLoginError'); if(err){err.textContent='Your membership is blocked. Please contact the gym.';err.style.display='flex';} return; }if(m.status==='expired'){ const err=$('#gymLoginError'); if(err){err.textContent=`Membership expired on ${fmtDate(m.endDate)} — renew at gym.`;err.style.display='flex';} return; }state.auth={role:'member',email:m.email,gymId:g.id,memberId:m.id};state.publicGymId=null; state.publicGymMode='landing'; state.route='m-home'; state.currentGymId=g.id; state.cart=[];saveAuth(); render(); toast('Welcome back, '+m.name.split(' ')[0]+'!');} else {const err=$('#gymLoginError'); if(err){err.textContent='Invalid User ID or password for this gym.';err.style.display='flex';}}return;}
  if(t==='socialForm'){e.preventDefault();const g=G();if(!g)return;const f=new FormData(e.target);g.socials={instagram:f.get('instagram').trim(),facebook:f.get('facebook').trim(),whatsapp:f.get('whatsapp').trim(),youtube:f.get('youtube').trim(),tiktok:f.get('tiktok').trim()};saveGym(g.id);toast('Saved ✓');render();}
  if(t==='gymProfileForm'){e.preventDefault();const g=G();if(!g)return;const f=new FormData(e.target);Object.assign(g,{name:f.get('name').trim(),city:f.get('city').trim(),phone:f.get('phone').trim(),address:f.get('address').trim(),upiId:f.get('upiId').trim()});saveGym(g.id);toast('Saved ✓');render();}
  if(t==='referralForm'){e.preventDefault();const g=G();if(!g)return;const f=new FormData(e.target);const r=parseFloat(f.get('reward'))||0;const d=parseFloat(f.get('discount'))||0;if(d<0||d>100){toast('0-100 only','err');return;}g.settings={referralEnabled:f.get('enabled')==='on',reward:r,discount:d,minReferrals:1,rewardType:'cash',terms:f.get('terms').trim()};saveGym(g.id);toast('Saved ✓');render();}
  if(t==='faceDeviceForm'){e.preventDefault();const g=G();if(!g)return;const f=new FormData(e.target);g.faceDevice={...g.faceDevice,deviceId:f.get('deviceId').trim(),endpoint:f.get('endpoint').trim(),apiKey:f.get('apiKey').trim()};saveGym(g.id);toast('Saved ✓');render();}
  if(t==='mediaVideoForm'){e.preventDefault();const g=G();if(!g)return;const f=new FormData(e.target);g.promoVideoUrl=f.get('promoVideoUrl').trim();saveGym(g.id);toast('Saved ✓');render();}
});

document.addEventListener('change', async e => {
  if (e.target.id === 'file-gallery') {
    const file = e.target.files?.[0];
    if (!file) return;
    const g = G();
    if (!g) return;
    try {
      const r = await compressImage(file, { maxDim: 800, quality: 0.8, maxBytes: 200*1024 });
      g.gallery = g.gallery || [];
      g.gallery.push(r.dataUrl);
      saveGym(g.id);
      render();
      toast('Photo added');
    } catch(err) {
      toast('Failed: ' + err.message, 'err');
    }
  }
});

function render(){
  if(state.publicGymId){
    const g=state.gyms.find(x=>x.id===state.publicGymId);
    if(g){$('#authRoot').innerHTML=viewPublicLanding(g);$('#appRoot').style.display='none';$('#cart').innerHTML='';return;}
    else{state.publicGymId=null;state.publicGymMode='landing';}
  }
  if(!isAuth()){$('#authRoot').innerHTML=authScreen();$('#appRoot').style.display='none';$('#cart').innerHTML='';bindAuth();return;}
  $('#authRoot').innerHTML='';$('#appRoot').style.display='';
  const role=state.auth.role;const allowed=(NAV[role]||[]).map(n=>n.id);if(!allowed.includes(state.route))state.route=allowed[0];
  const meta=VIEWMETA[state.route]||{t:'',s:''};$('#pgTitle').textContent=meta.t;$('#pgSub').textContent=meta.s;
  const views={'sa-dash':viewSADash,gyms:viewGyms,'platform-plans':viewPlatformPlans,dashboard:viewDashboard,members:viewMembers,'face-access':viewFaceAccess,products:viewProducts,'member-plans':viewMemberPlans,social:viewSocial,media:viewMedia,notifications:viewNotifications,settings:viewSettings,'ai-settings':viewAISettings,'m-home':viewMHome,'m-progress':viewMProgress,'m-face':viewMFace,'m-shop':viewMShop,'m-pay':viewMPay,'m-refer':viewMRefer,'m-coach':viewMCoach};
  $('#view').innerHTML=(views[state.route]||viewSADash)();
  renderNav();renderFoot();renderTop();renderCart();
  setTimeout(()=>{const s=$('#chatScroll');if(s)s.scrollTop=s.scrollHeight;},40);
}
(function removeNetlifyBadge(){const killBadge=()=>{const selectors=['iframe[title="Netlify"]','iframe[title="Netlify Drawer"]','#netlify-badge','.netlify-badge','netlify-badge','a[href*="netlify.com"]','[data-netlify-badge]'];selectors.forEach(sel=>{document.querySelectorAll(sel).forEach(el=>el.style.display='none');});document.querySelectorAll('a, div, iframe').forEach(el=>{if(el.textContent&&el.textContent.includes('Powered by Netlify')&&el.children.length<6){el.style.display='none';}});};killBadge();setInterval(killBadge,500);})();

(async function init(){
  try{
    loadAI();
    await loadData();
    sweepExpirations();
    const params=new URLSearchParams(window.location.search);
    if(params.has('gym')){ state.publicGymId=params.get('gym'); }
    if(params.has('ref')){ state.pendingRefCode=params.get('ref'); }
    render();
  }catch(err){
    console.error("Init error, falling back:", err);
    render();
  }
})();
</script>
