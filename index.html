<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Welcome | AHK Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    /* ===== 1. Netlify badge suppression ===== */
    iframe[title="Netlify"], #netlify-badge, div[id*="netlify"],
    a[href*="netlify.com"], .netlify-badge,
    body > iframe[style*="position: fixed"] {
        display: none !important; visibility: hidden !important;
        opacity: 0 !important; width: 0 !important; height: 0 !important;
        pointer-events: none !important;
    }

    /* ===== 2. Reset ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #0b192c;
        height: 100vh; height: 100dvh; width: 100vw;
        display: flex; justify-content: center; align-items: center;
        position: fixed; top: 0; left: 0; overflow: hidden;
        -webkit-tap-highlight-color: transparent;
    }
    body::before {
        content: ''; position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%); width: 100vw; height: 100vh;
        background: radial-gradient(circle at center, rgba(230,46,60,0.12) 0%, transparent 60%);
        z-index: 0; pointer-events: none;
    }

    /* ===== 3. Landing ===== */
    .landing-wrapper {
        position: relative; z-index: 10; display: flex;
        flex-direction: column; align-items: center;
        padding: 20px; text-align: center;
    }
    .landing-logo {
        max-width: 250px; height: auto; display: block;
        margin-bottom: 50px;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        cursor: pointer; user-select: none;
        transition: transform 0.2s;
    }
    .landing-logo:active { transform: scale(0.95); }
    .single-btn {
        display: inline-block; padding: 20px 55px;
        font-family: 'Montserrat', sans-serif; font-size: 1.1rem;
        font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
        text-decoration: none; color: #ffffff; background-color: #e62e3c;
        border: 2px solid #e62e3c; border-radius: 50px;
        transition: all 0.4s ease;
        box-shadow: 0 10px 30px rgba(230,46,60,0.3); cursor: pointer;
    }
    .single-btn:hover, .single-btn:active {
        background-color: transparent; color: #e62e3c;
        transform: translateY(-2px); box-shadow: 0 15px 40px rgba(230,46,60,0.5);
    }

    /* ===== 4. Modals ===== */
    .modal {
        display: none; position: fixed; z-index: 999999;
        left: 0; top: 0; width: 100%; height: 100%;
        background-color: rgba(11,25,44,0.85); backdrop-filter: blur(8px);
        justify-content: center; align-items: center; padding: 15px;
    }
    .modal-content {
        background-color: #11223a; padding: 30px; border-radius: 20px;
        border: 1px solid rgba(230,46,60,0.2);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        width: 100%; max-width: 420px;
        position: relative; max-height: 85vh; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        animation: fadeIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
        text-align: center; margin-bottom: 20px; padding-bottom: 15px;
        border-bottom: 1px solid #2a3b52;
    }
    .modal-header h2 {
        color: #fff; font-family: 'Montserrat', sans-serif;
        font-size: 1.2rem; letter-spacing: 1px;
    }
    .modal-header p { color: #a0aec0; font-size: 0.85rem; margin-top: 5px; }
    .close-btn {
        position: absolute; top: 15px; right: 20px;
        color: #a0aec0; font-size: 28px; font-weight: bold;
        cursor: pointer; line-height: 1; padding: 5px;
        transition: color 0.3s;
    }
    .close-btn:hover, .close-btn:active { color: #e62e3c; }

    /* ===== 5. Inputs / buttons ===== */
    .admin-input-group { margin-bottom: 15px; text-align: left; }
    .admin-input-group label {
        display: block; color: #a0aec0; font-size: 0.85rem; margin-bottom: 5px;
    }
    .admin-input-group input {
        width: 100%; padding: 15px; border-radius: 12px;
        border: 1px solid #4a5a70; background-color: #11223a; color: #fff;
        font-family: 'Poppins', sans-serif; outline: none; font-size: 1rem;
        transition: border-color 0.3s;
    }
    .admin-input-group input:focus { border-color: #e62e3c; }
    .add-btn {
        width: 100%; padding: 15px; background-color: #e62e3c; color: #fff;
        border: none; border-radius: 12px;
        font-family: 'Montserrat', sans-serif; font-weight: 600;
        font-size: 1rem; cursor: pointer; transition: 0.3s;
    }
    .add-btn:hover, .add-btn:active { background-color: #c9212f; }

    /* ===== 6. Google sign-in button ===== */
    .google-btn {
        display: flex; align-items: center; justify-content: center;
        gap: 12px; width: 100%; padding: 14px; margin-top: 8px;
        background: #ffffff; color: #333;
        border: none; border-radius: 12px;
        font-family: 'Montserrat', sans-serif; font-weight: 600;
        font-size: 0.95rem; cursor: pointer; transition: 0.2s;
    }
    .google-btn:hover, .google-btn:active { background: #f1f1f1; }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ===== 7. Error message ===== */
    .error-msg {
        color: #ff4d4d; font-size: 0.85rem; text-align: center;
        margin-top: 15px; display: none;
        background: rgba(255,77,77,0.1); padding: 10px; border-radius: 8px;
    }

    /* ===== 8. Admin panel ===== */
    .admin-panel { border: 1px solid #4a5a70; background-color: #0d1b2a; }
    .admin-panel .modal-header h2 { color: #e62e3c; }
    .admin-user {
        display: flex; align-items: center; gap: 12px;
        padding: 10px; background: #11223a; border-radius: 12px;
        margin-bottom: 15px; border: 1px solid #2a3b52;
    }
    .admin-user strong { color: #fff; font-size: 0.9rem; display: block; }
    .admin-user small { color: #a0aec0; font-size: 0.75rem; }
    .admin-avatar {
        width: 40px; height: 40px; border-radius: 50%;
        background: #e62e3c; object-fit: cover; flex-shrink: 0;
    }
    .admin-list-title {
        color: #fff; font-size: 0.85rem;
        margin-top: 25px; margin-bottom: 10px; text-align: left;
        border-bottom: 1px solid #4a5a70; padding-bottom: 5px;
    }
    .admin-link-item {
        display: flex; justify-content: space-between; align-items: center;
        background-color: #11223a; padding: 10px 12px; border-radius: 8px;
        margin-bottom: 8px; border-left: 3px solid #e62e3c;
    }
    .admin-link-item.hidden-link { opacity: 0.5; border-left-color: #4a5a70; }
    .admin-link-info { text-align: left; flex-grow: 1; overflow: hidden; }
    .admin-link-info strong { color: #fff; font-size: 0.9rem; display: block; }
    .admin-link-info small {
        color: #a0aec0; font-size: 0.75rem; display: block;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .action-btn {
        background: transparent; border: none; cursor: pointer;
        font-size: 1.3rem; margin-left: 10px; padding: 5px;
        transition: transform 0.2s;
    }
    .action-btn:hover, .action-btn:active { transform: scale(1.1); }
    .toggle-btn { color: #4CAF50; }
    .toggle-btn.is-hidden { color: #889cb5; }

    .logout-btn, .reset-btn, .seed-btn, .test-api-btn {
        width: 100%; padding: 12px; border-radius: 8px; cursor: pointer;
        font-family: 'Poppins', sans-serif; transition: 0.3s; font-size: 0.9rem;
        background-color: transparent;
    }
    .test-api-btn { color: #9b59b6; border: 1px solid #9b59b6; margin-top: 15px; }
    .test-api-btn:hover { background-color: #9b59b6; color: #fff; }
    .seed-btn  { color: #4CAF50; border: 1px solid #4CAF50; margin-top: 15px; }
    .seed-btn:hover  { background-color: #4CAF50; color: #fff; }
    .reset-btn { color: #f39c12; border: 1px solid #f39c12; margin-top: 15px; }
    .reset-btn:hover { background-color: #f39c12; color: #fff; }
    .logout-btn{ color: #ff4d4d; border: 1px solid #ff4d4d; margin-top: 10px; }
    .logout-btn:hover{ background-color: #ff4d4d; color: #fff; }

    /* ===== 9. States ===== */
    .loading-state { text-align: center; padding: 30px 10px; }
    .loading-state p { color: #a0aec0; font-size: 0.85rem; margin-top: 15px; }
    .spinner {
        width: 36px; height: 36px; margin: 0 auto;
        border: 3px solid #2a3b52; border-top-color: #e62e3c;
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
        color: #a0aec0; font-size: 0.85rem; text-align: center;
        padding: 20px 10px; background: #11223a; border-radius: 8px;
    }

    .config-warning {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999999;
        background: #f39c12; color: #1a1a1a; text-align: center;
        font-size: 0.8rem; padding: 8px 12px; font-weight: 500;
    }

    @media (max-width: 480px) {
        .landing-logo { max-width: 180px; margin-bottom: 40px; }
        .single-btn { padding: 18px 40px; font-size: 1rem; width: 100%; }
        .modal-content { padding: 25px 20px; max-height: 90vh; }
        .close-btn { top: 10px; right: 15px; }
    }
</style>
</head>
<body>

<div id="configWarning" class="config-warning" style="display:none;">
    ⚠️ Firebase not configured — running in <strong>demo mode</strong>.
</div>

<div class="landing-wrapper">
    <img src="logo.png" alt="AHK Enterprise Logo" class="landing-logo" id="secretLogo">
    <button id="openOptionsBtn" class="single-btn">Enter</button>
</div>

<!-- ============ Front: search & open ============ -->
<div id="optionsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeOptions">&times;</span>
        <div class="modal-header">
            <h2>Open App</h2>
            <p>Enter the app name to continue</p>
        </div>
        <div class="admin-input-group">
            <input type="text" id="searchAppInput" placeholder="e.g., Mi Gym App"
                   autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <button class="add-btn" id="searchOpenBtn">Open Now</button>
        <p id="searchError" class="error-msg"></p>
    </div>
</div>

<!-- ============ Admin ============ -->
<div id="adminModal" class="modal">
    <div class="modal-content admin-panel">
        <span class="close-btn" id="closeAdmin">&times;</span>

        <div id="authLoading" class="loading-state" style="display:none;">
            <div class="spinner"></div>
            <p>Signing you in…</p>
        </div>

        <div id="authSection">
            <div class="modal-header">
                <h2>🔒 Admin Access</h2>
                <p>Sign in with your Google account.</p>
            </div>
            <button id="googleSignInBtn" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
            <p id="authError" class="error-msg"></p>
        </div>

        <div id="adminContentSection" style="display:none;">
            <div class="admin-user">
                <img id="adminAvatar" class="admin-avatar" alt="Admin">
                <div>
                    <strong id="adminName">Admin</strong>
                    <small id="adminEmailDisplay">—</small>
                </div>
            </div>
            <div class="modal-header">
                <h2>⚙️ Admin Panel</h2>
                <p>Manage Apps &amp; Visibility</p>
            </div>
            <div class="admin-input-group">
                <label>Display Name (Exact Name to search)</label>
                <input type="text" id="newLinkName" placeholder="e.g., New App" autocomplete="off">
            </div>
            <div class="admin-input-group">
                <label>Folder Path / URL</label>
                <input type="text" id="newLinkUrl" placeholder="e.g., newapp/index.html" autocomplete="off">
            </div>
            <button class="add-btn" id="addLinkBtn">+ Add App</button>

            <div class="admin-list-title">App List (👁️ Hide / 🗑️ Remove)</div>
            <div id="adminLinksList"></div>

            <!-- NETLIFY FUNCTION TEST BUTTON -->
            <button class="test-api-btn" id="testApiBtn">🔐 Test Secure API (px.js)</button>

            <button class="seed-btn"  id="seedBtn"  style="display:none;">🌱 Seed Default Apps</button>
            <button class="reset-btn" id="resetBtn">⚠️ Reset Everything</button>
            <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>
    </div>
</div>

<!-- ============================================================
     APP LOGIC — Firebase v10 modular SDK
     ============================================================ -->
<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  onAuthStateChanged, signOut as fbSignOut,
  setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, updateDoc,
  onSnapshot, query, where, orderBy, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ============================================================
   ⚙️  Firebase configuration
   ============================================================ */
const firebaseConfig = {
  apiKey:            "AIzaSyDXG4MmHYKd5VRC3XZy4qOpcEfQV-iJDkY",
  authDomain:        "apponsale-c11f3.firebaseapp.com",
  projectId:         "apponsale-c11f3",
  storageBucket:     "apponsale-c11f3.firebasestorage.app",
  messagingSenderId: "701953325146",
  appId:             "1:701953325146:web:82d8dd70db61be07108063",
  measurementId:     "G-H3SWJ1ECME"
};

const SUPERADMIN_EMAIL = "cupncare@gmail.com";
const APP_COLLECTION   = "apps";

const defaultLinks = [
  { name: "Cup N Care",          url: "cupncare/index.html",   visible: true },
  { name: "AHK Wellness",        url: "ahk/index.html",        visible: true },
  { name: "Abdul Hameed Kunhi",  url: "ahk/index.html",        visible: true },
  { name: "Mi Gym App",          url: "migym/index.html",      visible: true },
  { name: "Profile Mi",          url: "profilemi/index.html",  visible: true }
];

const isConfigured = !Object.values(firebaseConfig)
  .some(v => !v || String(v).includes('PASTE'));

let auth = null, db = null, provider = null;
if (isConfigured) {
  const fbApp = initializeApp(firebaseConfig);
  auth     = getAuth(fbApp);
  db       = getFirestore(fbApp);
  
  setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));
  
  provider = new GoogleAuthProvider();
  provider.addScope('email');
  provider.addScope('profile');
  provider.setCustomParameters({ prompt: 'select_account' });
} else {
  document.getElementById('configWarning').style.display = 'block';
}

/* ============================================================
   Helper: Extract email safely
   ============================================================ */
function getUserEmail(user) {
  if (!user) return null;
  if (user.email) return user.email.toLowerCase();
  if (user.providerData && user.providerData.length > 0) {
    for (const profile of user.providerData) {
      if (profile.email) return profile.email.toLowerCase();
    }
  }
  return null;
}

/* ============================================================
   Data layer
   ============================================================ */
const AppStore = {
  _localKey: 'ahkLinksData',

  _readLocal() {
    try {
      const raw = JSON.parse(localStorage.getItem(this._localKey) || 'null');
      if (Array.isArray(raw)) return raw;
    } catch {}
    return defaultLinks.map((d, i) => ({ id: String(i + 1), ...d }));
  },
  _writeLocal(list) {
    localStorage.setItem(this._localKey, JSON.stringify(list));
  },

  async getVisibleApps() {
    if (!isConfigured) return this._readLocal().filter(a => a.visible);
    try {
      const snap = await getDocs(
        query(collection(db, APP_COLLECTION), where('visible', '==', true))
      );
      const apps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (apps.length === 0) {
        return defaultLinks.filter(a => a.visible).map((d, i) => ({ id: String(i + 1), ...d }));
      }
      return apps;
    } catch (e) {
      console.warn("Using fallback defaults (check Firestore rules or network):", e);
      return defaultLinks.filter(a => a.visible).map((d, i) => ({ id: String(i + 1), ...d }));
    }
  },

  subscribeAll(cb, errCb) {
    if (!isConfigured) {
      cb(this._readLocal());
      return () => {};
    }
    return onSnapshot(
      query(collection(db, APP_COLLECTION), orderBy('createdAt', 'asc')),
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      errCb
    );
  },

  async addApp(name, url) {
    if (!isConfigured) {
      const list = this._readLocal();
      list.push({ id: Date.now().toString(), name, url, visible: true });
      this._writeLocal(list);
      return;
    }
    await setDoc(doc(collection(db, APP_COLLECTION)), {
      name, url, visible: true, createdAt: Date.now()
    });
  },

  async toggleVisibility(id, current) {
    if (!isConfigured) {
      const list = this._readLocal();
      const item = list.find(a => String(a.id) === String(id));
      if (item) { item.visible = !current; this._writeLocal(list); }
      return;
    }
    await updateDoc(doc(db, APP_COLLECTION, id), { visible: !current });
  },

  async deleteApp(id) {
    if (!isConfigured) {
      this._writeLocal(this._readLocal().filter(a => String(a.id) !== String(id)));
      return;
    }
    await deleteDoc(doc(db, APP_COLLECTION, id));
  },

  async resetAll() {
    if (!isConfigured) {
      this._writeLocal(defaultLinks.map((d, i) => ({ id: String(i + 1), ...d })));
      return;
    }
    const snap = await getDocs(collection(db, APP_COLLECTION));
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    await this.seedDefaults();
  },

  async seedDefaults() {
    if (!isConfigured) {
      this._writeLocal(defaultLinks.map((d, i) => ({ id: String(i + 1), ...d })));
      return;
    }
    for (const d of defaultLinks) {
      await setDoc(doc(collection(db, APP_COLLECTION)), {
        name: d.name, url: d.url, visible: d.visible, createdAt: Date.now()
      });
    }
  }
};

/* ============================================================
   Auth Manager
   ============================================================ */
const AuthManager = {
  async signIn() {
    if (!isConfigured) throw new Error("Firebase is not configured.");
    const res = await signInWithPopup(auth, provider);
    const email = getUserEmail(res.user);
    if (!email) {
      await fbSignOut(auth);
      throw new Error("Could not retrieve email from Google. Please try a different Google account.");
    }
    if (email !== SUPERADMIN_EMAIL.toLowerCase()) {
      await fbSignOut(auth);
      throw new Error(`Access denied. You signed in with "${email}". Please use the authorized account.`);
    }
    return res.user;
  },
  async signOut() {
    if (isConfigured) await fbSignOut(auth);
  },
  onChange(cb) {
    if (isConfigured) onAuthStateChanged(auth, cb);
  }
};

/* ============================================================
   UI Logic
   ============================================================ */
let adminAppsCache = [];
let adminUnsub = null;

const $ = id => document.getElementById(id);

function showLoginScreen() {
  $('authLoading').style.display         = 'none';
  $('authSection').style.display         = 'block';
  $('adminContentSection').style.display = 'none';
  $('authError').style.display           = 'none';
}

function showAdminPanel(user) {
  $('authLoading').style.display         = 'none';
  $('authSection').style.display         = 'none';
  $('adminContentSection').style.display = 'block';

  const fallbackAvatar =
    'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="50" fill="#e62e3c"/>' +
      '<text x="50" y="58" text-anchor="middle" fill="#fff" font-size="42" font-family="Arial">A</text></svg>'
    );
  $('adminAvatar').src = user.photoURL || fallbackAvatar;
  $('adminName').textContent = user.displayName || 'Admin';
  $('adminEmailDisplay').textContent = getUserEmail(user) || 'Admin';

  document.getElementById('adminModal').style.display = 'flex';

  if (adminUnsub) { adminUnsub(); adminUnsub = null; }
  adminUnsub = AppStore.subscribeAll(
    apps => { adminAppsCache = apps; renderAdminList(); },
    err  => {
      console.error(err);
      alert("Failed to load app list: " + err.message);
    }
  );
}

function handleAuthState(user) {
  if (!user) { 
    showLoginScreen(); 
    return; 
  }
  
  const email = getUserEmail(user);
  
  if (email === SUPERADMIN_EMAIL.toLowerCase()) {
    showAdminPanel(user);
  } else {
    showLoginScreen();
    const el = $('authError');
    el.textContent = email 
      ? `Access denied. The account (${email}) is not authorized.`
      : "Could not retrieve email from Google. Please try again.";
    el.style.display = 'block';
    AuthManager.signOut().catch(() => {});
  }
}

/* ============================================================
   Admin List Rendering
   ============================================================ */
function renderAdminList() {
  const list = $('adminLinksList');
  list.innerHTML = '';

  if (!adminAppsCache.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-state';
    empty.textContent = 'No apps yet. Click "Seed Default Apps" below.';
    list.appendChild(empty);
    $('seedBtn').style.display = 'block';
    return;
  }
  $('seedBtn').style.display = 'none';

  adminAppsCache.forEach(link => {
    const item = document.createElement('div');
    item.className = 'admin-link-item' + (link.visible ? '' : ' hidden-link');

    const info = document.createElement('div');
    info.className = 'admin-link-info';
    const strong = document.createElement('strong');
    strong.textContent = link.name;
    const small = document.createElement('small');
    small.textContent = link.url;
    info.appendChild(strong);
    info.appendChild(small);

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'action-btn ' +
      (link.visible ? 'toggle-btn' : 'toggle-btn is-hidden');
    toggleBtn.textContent = link.visible ? '👁️' : '🙈';
    toggleBtn.title = link.visible ? 'Hide' : 'Show';
    toggleBtn.addEventListener('click', () => handleToggle(link));

    const delBtn = document.createElement('button');
    delBtn.className = 'action-btn delete-btn';
    delBtn.textContent = '🗑️';
    delBtn.title = 'Delete';
    delBtn.addEventListener('click', () => handleDelete(link));

    item.append(info, toggleBtn, delBtn);
    list.appendChild(item);
  });
}

/* ============================================================
   Admin Actions
   ============================================================ */
async function handleToggle(link) {
  try {
    await AppStore.toggleVisibility(link.id, link.visible);
    if (!isConfigured) { adminAppsCache = AppStore._readLocal(); renderAdminList(); }
  } catch (e) { alert("Failed to update: " + e.message); }
}

async function handleDelete(link) {
  if (!confirm(`Remove "${link.name}" from the list?`)) return;
  try {
    await AppStore.deleteApp(link.id);
    if (!isConfigured) { adminAppsCache = AppStore._readLocal(); renderAdminList(); }
  } catch (e) { alert("Failed to delete: " + e.message); }
}

async function handleAdd() {
  const name = $('newLinkName').value.trim();
  const url  = $('newLinkUrl').value.trim();
  if (!name || !url) return alert("Please fill in both fields.");
  try {
    await AppStore.addApp(name, url);
    $('newLinkName').value = '';
    $('newLinkUrl').value  = '';
    if (!isConfigured) { adminAppsCache = AppStore._readLocal(); renderAdminList(); }
  } catch (e) { alert("Failed to add: " + e.message); }
}

async function handleReset() {
  if (!confirm("Reset all apps to defaults? This cannot be undone.")) return;
  try {
    await AppStore.resetAll();
    if (!isConfigured) { adminAppsCache = AppStore._readLocal(); renderAdminList(); }
  } catch (e) { alert("Reset failed: " + e.message); }
}

async function handleSeed() {
  try {
    await AppStore.seedDefaults();
    if (!isConfigured) { adminAppsCache = AppStore._readLocal(); renderAdminList(); }
  } catch (e) { alert("Seed failed: " + e.message); }
}

async function handleLogout() {
  if (adminUnsub) { adminUnsub(); adminUnsub = null; }
  try { await AuthManager.signOut(); } catch {}
  showLoginScreen();
  $('adminModal').style.display = 'none';
}

async function handleGoogleSignIn() {
  $('authError').style.display   = 'none';
  $('authSection').style.display = 'none';
  $('authLoading').style.display = 'block';
  try {
    await AuthManager.signIn();
  } catch (e) {
    $('authLoading').style.display = 'none';
    $('authSection').style.display = 'block';
    const el = $('authError');
    el.textContent = e.message || "Sign-in failed.";
    el.style.display = 'block';
  }
}

/* ============================================================
   🔐 Netlify Function Test (BFF Pattern)
   ============================================================ */
async function testSecureApi() {
  const btn = $('testApiBtn');
  const originalText = btn.textContent;
  btn.textContent = "⏳ Connecting to px.js...";
  btn.disabled = true;

  try {
    const response = await fetch('/.netlify/functions/px', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'test' })
    });

    const data = await response.json();
    alert(`✅ Backend Response:\n\n${data.message}\n\nKey Status: ${data.keyStatus}`);
    
  } catch (error) {
    console.error(error);
    alert("❌ Failed to reach backend. Are you running this on Netlify?");
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

/* ============================================================
   Front-end search & open (Resilient fetching)
   ============================================================ */
function safeNavigate(rawUrl) {
  try {
    if (rawUrl.startsWith('//')) return false;
    const u = new URL(rawUrl, window.location.href);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
    window.location.href = u.href;
    return true;
  } catch { return false; }
}

async function searchAndOpenApp() {
  const raw = $('searchAppInput').value.trim();
  const errEl = $('searchError');

  if (!raw) {
    errEl.textContent = 'Please enter an app name.';
    errEl.style.color = '#ff4d4d';
    errEl.style.display = 'block';
    return;
  }

  // Show a loading state
  errEl.textContent = 'Searching...';
  errEl.style.color = '#a0aec0'; // Grey
  errEl.style.display = 'block';

  try {
    // 🔄 Fetch the latest apps. We try the direct Firestore query first, 
    // but if it fails (due to rules or missing fields), we fall back to the safe AppStore method.
    let freshApps = [];
    
    if (isConfigured) {
      try {
        const snap = await getDocs(query(collection(db, APP_COLLECTION), where('visible', '==', true)));
        freshApps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        console.warn("Direct fetch failed, falling back to AppStore:", e);
        freshApps = await AppStore.getVisibleApps();
      }
    } else {
      freshApps = AppStore._readLocal().filter(a => a.visible);
    }

    const q = raw.toLowerCase();
    
    // Search for exact match first, then partial match
    const target = freshApps.find(a => String(a.name || '').toLowerCase().trim() === q) ||
                   freshApps.find(a => String(a.name || '').toLowerCase().includes(q));

    if (!target) {
      errEl.textContent = `"${raw}" not found or is hidden.`;
      errEl.style.color = '#ff4d4d'; 
      errEl.style.display = 'block';
      return;
    }
    
    errEl.style.display = 'none';
    $('searchAppInput').value = '';

    if (!safeNavigate(target.url)) {
      errEl.textContent = 'Invalid URL for this app.';
      errEl.style.color = '#ff4d4d';
      errEl.style.display = 'block';
    }

  } catch (error) {
    console.error("Search failed:", error);
    errEl.textContent = 'Search failed. Check connection or Firestore rules.';
    errEl.style.color = '#ff4d4d';
    errEl.style.display = 'block';
  }
}

/* ============================================================
   Wire up UI
   ============================================================ */
const optionsModal = $('optionsModal');
const adminModal   = $('adminModal');

$('openOptionsBtn').addEventListener('click', () => {
  optionsModal.style.display = 'flex';
  $('searchError').style.display = 'none';
  $('searchAppInput').value = '';
  setTimeout(() => $('searchAppInput').focus(), 100);
});
$('closeOptions').addEventListener('click', () => { optionsModal.style.display = 'none'; });
$('closeAdmin'  ).addEventListener('click', () => { adminModal.style.display   = 'none'; });
$('searchAppInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchAndOpenApp(); });
$('searchOpenBtn' ).addEventListener('click', searchAndOpenApp);

$('googleSignInBtn').addEventListener('click', handleGoogleSignIn);
$('addLinkBtn'     ).addEventListener('click', handleAdd);
$('resetBtn'       ).addEventListener('click', handleReset);
$('seedBtn'        ).addEventListener('click', handleSeed);
$('logoutBtn'      ).addEventListener('click', handleLogout);
$('testApiBtn'     ).addEventListener('click', testSecureApi);

let tapCount = 0, tapTimer;
$('secretLogo').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
  if (tapCount >= 5) {
    tapCount = 0;
    adminModal.style.display = 'flex';
  }
});

window.addEventListener('click', e => {
  if (e.target === optionsModal) optionsModal.style.display = 'none';
  if (e.target === adminModal)   adminModal.style.display   = 'none';
});

/* ============================================================
   Bootstrap
   ============================================================ */
(async function bootstrap() {
  if (isConfigured) {
    AuthManager.onChange(handleAuthState);
  } else {
    showAdminPanel({
      email: "demo@example.com",
      displayName: 'Demo Admin',
      photoURL: ''
    });
    adminAppsCache = AppStore._readLocal();
    renderAdminList();
  }
})();
</script>
