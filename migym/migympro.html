<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiGym Pro</title>
<meta name="theme-color" content="#07080a">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#07080a;color:#e9edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
input,textarea,select,button{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#262b36;border-radius:8px}
img{max-width:100%;display:block}
:root{--bg:#07080a;--panel:#0f1115;--panel2:#151821;--panel3:#1b1f29;--line:#20242d;--line2:#2b303b;--txt:#e9edf3;--muted:#7f8899;--muted2:#5a6273;--acc:#c6ff3d;--grn:#3ddc97;--dgr:#ff5252;--wrn:#ffb340;--inf:#4d9dff;--pur:#a78bfa;--r:14px}
.auth{position:fixed;inset:0;z-index:500;background:radial-gradient(80% 60% at 50% -10%,rgba(198,255,61,.09),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.acard{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
.abrand{display:flex;justify-content:center;margin-bottom:18px}
.mk{width:84px;height:84px;border-radius:18px;display:grid;place-items:center;cursor:pointer;position:relative;background:linear-gradient(140deg,var(--acc),#7bbf00);overflow:hidden}
.mk img{width:100%;height:100%;object-fit:cover}
.atitle{text-align:center;font-size:21px;font-weight:800;margin-bottom:6px}
.asub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px}
.aerr{background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);color:#ff8080;border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:650;margin-bottom:14px}
.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:10px 11px;font-size:13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(198,255,61,.1)}
.pw{position:relative}
.pw .inp{padding-right:44px}
.pwt{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:650;font-size:13px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);transition:.15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel3)}
.btn.acc{background:var(--acc);color:#0b0d07;border-color:var(--acc)}
.btn.dgr{background:rgba(255,82,82,.12);border-color:rgba(255,82,82,.35);color:#ff8080}
.btn.gho{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.blk{width:100%}
.btn.ai{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-color:#7c3aed}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted);background:var(--panel2);border:1px solid transparent;flex-shrink:0;position:relative}
.ib:hover{background:var(--panel3);color:var(--txt)}
.ib.d:hover{color:#ff8080;background:rgba(255,82,82,.12)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{font-size:14px}
.ch .sp{flex:1}
.ch .sub{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);margin-bottom:6px}
.stat .lbl{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.stat .val{font-size:22px;font-weight:800}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
.cm{display:flex;align-items:center;gap:10px;min-width:0}
.cm .nm{font-weight:650;font-size:13px}
.cm .em{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.active{background:rgba(61,220,151,.12);color:#4fe3a4}
.pill.expired{background:rgba(255,179,64,.12);color:#ffc163}
.pill.blocked{background:rgba(255,82,82,.13);color:#ff7b7b}
.pill.pending{background:rgba(167,139,250,.13);color:#b8a3ff}
.pill.face{background:rgba(77,157,255,.13);color:#7bb6ff}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;background:var(--panel3);color:var(--muted);border:1px solid var(--line2)}
.badge.acc{background:rgba(198,255,61,.12);color:var(--acc);border-color:rgba(198,255,61,.25)}
.badge.wrn{background:rgba(255,179,64,.12);color:#ffc163;border-color:rgba(255,179,64,.25)}
.badge.dgr{background:rgba(255,82,82,.12);color:#ff8080;border-color:rgba(255,82,82,.3)}
.ov{position:fixed;inset:0;background:rgba(3,4,6,.78);backdrop-filter:blur(6px);z-index:700;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.lg{max-width:760px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.mh h3{font-size:15px}
.mh .sub{font-size:12px;color:var(--muted)}
.mb{padding:16px;flex:1;overflow-y:auto;min-height:0}
.mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0}
#toast{position:fixed;bottom:22px;right:22px;z-index:900;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:10px 14px;border-radius:9px;font-size:12.5px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:340px;pointer-events:auto;animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.err{border-left-color:var(--dgr)}
.toast.warn{border-left-color:var(--wrn)}
.aor{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.aor::before,.aor::after{content:'';flex:1;height:1px;background:var(--line2)}
.areg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.paid-check{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;cursor:pointer;padding:12px;background:rgba(61,220,151,.1);border-radius:8px;border:1px solid rgba(61,220,151,.2)}
.paid-check input{width:18px;height:18px;accent-color:var(--grn);cursor:pointer}
.photo-cap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:var(--panel2);border:1px dashed var(--line2);border-radius:12px;text-align:center}
.photo-cap .preview{width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--panel3);display:grid;place-items:center;border:2px solid var(--line2)}
.photo-cap .preview img{width:100%;height:100%;object-fit:cover}
.photo-cap .preview .ic{font-size:36px;color:var(--muted)}
.photo-cap input[type="file"]{display:none}
.cam-view{width:100%;max-width:320px;aspect-ratio:1;background:#000;border-radius:16px;overflow:hidden;position:relative;margin:0 auto;border:2px solid var(--line2)}
.cam-view video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-overlay{position:absolute;inset:0;border:40px solid rgba(0,0,0,.4);border-radius:50%;pointer-events:none}
.ban{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.ban.inf{background:rgba(77,157,255,.08);border-color:rgba(77,157,255,.3)}
.ban.dng{background:rgba(255,82,82,.08);border-color:rgba(255,82,82,.3)}
.ban.suc{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)}
.ban .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex-shrink:0}
.ban h3{font-size:14px;margin-bottom:2px}
.ban p{font-size:12px;color:var(--muted)}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:3px solid var(--gc)}
.gcard.blocked{opacity:.7}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gn{font-weight:800;font-size:14px}
.gc{font-size:11px;color:var(--muted)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--dgr);flex-shrink:0}
.sd.active{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;font-size:11px}
.gs .k{color:var(--muted);margin-bottom:2px}
.gs .v{font-weight:800;font-size:14px}
.gf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.gf .sp{flex:1}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr img{width:120px;height:120px;border-radius:12px;background:#fff;padding:8px;flex-shrink:0}
.qr-meta{flex:1;min-width:200px}
.qr-url{font-family:monospace;font-size:11px;background:var(--panel2);padding:8px 10px;border-radius:8px;word-break:break-all;border:1px solid var(--line);margin-bottom:10px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbox{position:relative;flex:1;min-width:200px;max-width:320px}
.sbox .inp{padding-left:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);cursor:pointer}
.chip.on{background:rgba(198,255,61,.15);border-color:var(--acc);color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:3px}
.kpi .v{font-size:18px;font-weight:800}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ig .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:2px}
.ig .v{font-weight:700;font-size:13px;word-break:break-all}
.div{height:1px;background:var(--line);margin:14px 0}
.empty{padding:32px 16px;text-align:center;color:var(--muted2);font-size:13px;border:1px dashed var(--line2);border-radius:10px}
.list{display:flex;flex-direction:column}
.lr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:none}
.lr .g{flex:1;min-width:0}
.lr .t{font-weight:650;font-size:13px}
.lr .s{font-size:11px;color:var(--muted)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pi{aspect-ratio:1;background:var(--panel2);display:grid;place-items:center;font-size:44px;position:relative}
.pi img{width:100%;height:100%;object-fit:cover}
.pi .stock{position:absolute;top:8px;right:8px}
.pb{padding:12px;flex:1}
.pc{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:3px}
.pb h3{font-size:14px;margin-bottom:6px}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pf .price{font-weight:800;font-size:16px;color:var(--acc)}
.pa{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:4px;border:1px solid var(--line2)}
.qty button{width:24px;height:24px;border-radius:6px;background:var(--panel3);display:grid;place-items:center;font-weight:800}
.qty .n{font-weight:800;min-width:20px;text-align:center;font-size:13px}
.flow{display:flex;flex-direction:column;gap:8px}
.fs{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line2)}
.fs.done{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)}
.fs.cur{background:rgba(198,255,61,.08);border-color:rgba(198,255,61,.35)}
.fs .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);font-weight:800;font-size:12px;flex-shrink:0}
.fs.done .n{background:var(--grn);color:#0b0d07}
.fs.cur .n{background:var(--acc);color:#0b0d07}
.fs .b{flex:1}
.fs .t{font-weight:700;font-size:13px}
.fs .s{font-size:11px;color:var(--muted)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 280px);min-height:320px;max-height:560px}
.cscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px;margin-bottom:10px}
.cmsg{display:flex;gap:8px;align-items:flex-start}
.cmsg.user{flex-direction:row-reverse}
.cmsg .who{width:28px;height:28px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:11px;flex-shrink:0}
.cmsg.user .who{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
.cmsg.ai .who{background:var(--acc);color:#0b0d07}
.cmsg .bub{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.cmsg.user .bub{background:var(--panel3)}
.cin{display:flex;gap:8px;align-items:flex-end}
.cin textarea{flex:1;resize:none;max-height:100px}
.ci{position:fixed;right:22px;bottom:96px;z-index:80;background:var(--acc);color:#0b0d07;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:13px}
.ci .info b{display:block;font-size:14px}
.ci .info span{font-size:10.5px;opacity:.75}
.notif{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:none}
.nch{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);flex-shrink:0;font-size:16px}
.upi{background:rgba(0,0,0,.3);border:1px dashed var(--line2);border-radius:12px;padding:16px}
.upi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.upi .amt{font-size:26px;font-weight:800;margin:4px 0 6px}
.upi .uid{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin:12px 0}
.upi .uid .k{font-size:10.5px;color:var(--muted);display:block}
.upi .uid .v{font-family:monospace;font-size:12px;font-weight:700;word-break:break-all}
.landing{position:fixed;inset:0;overflow-y:auto;background:radial-gradient(80% 60% at 50% -10%,rgba(198,255,61,.06),transparent 60%),var(--bg);z-index:400}
.landing-wrap{max-width:640px;margin:0 auto;padding:20px}
.landing-hero{text-align:center;padding:28px 20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:14px}
.logo-big{width:96px;height:96px;border-radius:24px;background:var(--panel2);border:2px solid var(--gcolor);display:grid;place-items:center;font-size:48px;margin:0 auto 16px;overflow:hidden}
.logo-big img{width:100%;height:100%;object-fit:cover}
.landing-hero h1{font-size:24px;margin-bottom:6px}
.landing-hero p{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.cta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.section h2{font-size:15px;margin-bottom:12px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 8px;gap:4px;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .mk{width:36px;height:36px;flex:0 0 36px;border-radius:10px}
.bn{font-size:18px;font-weight:800;letter-spacing:.06em}
.bs{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13px;width:100%;text-align:left}
.ni:hover{background:var(--panel2);color:var(--txt)}
.ni.on{background:linear-gradient(90deg,rgba(198,255,61,.14),transparent);color:var(--acc)}
.ni.lo{color:var(--dgr);margin-top:auto}
.ni .bd{margin-left:auto;background:var(--panel3);color:var(--muted);font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.sfoot{border-top:1px solid var(--line);padding-top:10px;display:flex;align-items:center;gap:8px}
.sfoot .who{font-size:11px;flex:1;min-width:0}
.sfoot .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.sfoot .who span{color:var(--muted);font-size:10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(7,8,10,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:18px}
.top .sub{color:var(--muted);font-size:12px}
.top .sp{flex:1}
.body{padding:18px 20px 60px;display:flex;flex-direction:column;gap:16px;max-width:1400px;width:100%}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.hint{font-size:11px;color:var(--muted2)}
.mobile-menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:none;border-top:1px solid var(--line);z-index:50;transform:translateY(calc(100% - 64px));transition:transform .3s ease}
  .side.expanded{transform:translateY(0)}
  .brand{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px}

async function computeFaceTemplate(videoEl){
  if(!videoEl) return null;
  if(videoEl.readyState < 2){ await new Promise((resolve, reject) => { const t = setTimeout(() => reject(new Error('Video not ready')), 3000); videoEl.onloadeddata = () => { clearTimeout(t); resolve(); }; }); }
  const size = 16;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const x = c.getContext('2d'); x.drawImage(videoEl, 0, 0, size, size);
  const d = x.getImageData(0, 0, size, size).data;
  const bytes = new Uint8Array(32);
  let bit = 0;
  for(let i = 0; i < size*size; i++){ const lum = d[i*4]*0.299 + d[i*4+1]*0.587 + d[i*4+2]*0.114; if(lum > 128) bytes[bit >> 3] |= (1 << (7 - (bit & 7))); bit++; }
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
}
function hammingMatches(a, b){
  try {
    if(typeof a !== 'string' || typeof b !== 'string') return false;
    if(!/^[0-9a-f]+$/i.test(a) || !/^[0-9a-f]+$/i.test(b)) return false;
    if(a.length !== b.length) return false;
    let diff = 0;
    for(let i = 0; i < a.length; i++){ let x = parseInt(a[i],16) ^ parseInt(b[i],16); diff += (x&1)+((x>>1)&1)+((x>>2)&1)+((x>>3)&1); if(diff > 30) return false; }
    return true;
  } catch { return false; }
}

function compressImage(file, opts={}){
  const maxDim = opts.maxDim || 640, q = opts.quality || 0.75, maxBytes = opts.maxBytes || 180*1024;
  return new Promise((resolve, reject) => {
    if(!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('Not an image'));
    if(file.size > 5*1024*1024) return reject(new Error('Image too large'));
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        try {
          let w = img.width, h = img.height;
          if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } } else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
          const c = document.createElement('canvas'); c.width=w; c.height=h;
          const x = c.getContext('2d'); x.fillStyle='#0f1115'; x.fillRect(0,0,w,h);
          x.drawImage(img, 0, 0, w, h);
          let mime = 'image/webp'; let url = c.toDataURL(mime, q);
          if(!url.startsWith('data:image/webp')){ mime='image/jpeg'; url = c.toDataURL(mime, q); }
          let qq = q;
          while(url.length*0.75 > maxBytes && qq > 0.35){ qq -= 0.1; url = c.toDataURL(mime, qq); }
          resolve({ dataUrl: url });
        } catch(err) { reject(err); }
      };
      img.onerror = () => reject(new Error('Decode failed'));
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}
async function uploadCompressedImage(file, folder, maxBytes=120*1024){
  const CLOUD_NAME = "ivfmhqkd", UPLOAD_PRESET = "migym_preset";
  const r = await compressImage(file, { maxDim: 480, quality: 0.72, maxBytes });
  try {
    const blob = await (await fetch(r.dataUrl)).blob();
    const formData = new FormData();
    formData.append('file', blob);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('folder', folder);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
    if(!res.ok) throw new Error('Cloudinary failed');
    const data = await res.json();
    return data.secure_url;
  } catch (err) { return r.dataUrl; }
}

    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key}, body: JSON.stringify({ model, messages:[{role:'system',content:sys},{role:'user',content:user}], temperature:0.7 })});
    if(!r.ok) throw new Error('AI error '+r.status);
    const d = await r.json(); return d.choices?.[0]?.message?.content || '';
  }
  if(provider === 'gemini'){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.key}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{parts:[{text:sys+'\n\n'+user}]}] })});
    if(!r.ok) throw new Error('AI error '+r.status);
    const d = await r.json(); return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
  }
  throw new Error('Unknown provider');
}

async function loadGymBundle(gymId){
  const gSnap = await getDoc(doc(db,'gyms',gymId));
  if(!gSnap.exists()) throw new Error('Gym not found');
  const gym = { id: gymId, ...gSnap.data() };
  const [m,p,n] = await Promise.all([
    getDocs(collection(db,'gyms',gymId,'members')).catch(()=>({docs:[]})),
    getDocs(collection(db,'gyms',gymId,'products')).catch(()=>({docs:[]})),
    getDocs(collection(db,'gyms',gymId,'notifications')).catch(()=>({docs:[]}))
  ]);
  gym.members = m.docs.map(d=>({id:d.id,...d.data()}));
  gym.products = p.docs.map(d=>({id:d.id,...d.data()}));
  gym.notifications = n.docs.map(d=>({id:d.id,...d.data()}));
  gym.settings = {...DEFAULT_SETTINGS, ...(gym.settings||{})};
  gym.memberPlans = {...DEFAULT_MEMBER_PLANS, ...(gym.memberPlans||{})};
  gym.socials = gym.socials || {};
  gym.lockDevice = gym.lockDevice || {type:'', config:{}, enabled:false, lastTest:null};
  return gym;
}
async function loadAllPublicGyms(){
  try {
    const snap = await getDocs(collection(db,'public_gyms'));

      const g = { id: d.id, ...d.data() };
      g.members = []; g.products = []; g.promotions = [];
      g.socials = g.socials || {};
      g.memberPlans = { ...DEFAULT_MEMBER_PLANS, ...(g.memberPlans||{}) };
      return g;
    });
  } catch(e){ return []; }
}
async function loadAllGymsForSA(){

}

function statusPill(m){
  if(m.status === 'blocked') return `<span class="pill blocked">Blocked</span>`;
  if(m.status === 'expired') return `<span class="pill expired">Expired</span>`;
  if(m.approvalStatus === 'pending_payment') return `<span class="pill pending">Pending Pay</span>`;
  if(m.approvalStatus === 'pending_approval') return `<span class="pill pending">Pending</span>`;
  if(m.approvalStatus === 'face_pending') return `<span class="pill face">Face Scan</span>`;
  return `<span class="pill active">Active</span>`;
}

function viewMembers(){
  const g = G(); if(!g) return `<div class="empty">No gym</div>`;
  let list = (g.members||[]).slice();
  const q = state.query.trim().toLowerCase();
  if(q) list = list.filter(m => (m.name||'').toLowerCase().includes(q) || (m.email||'').toLowerCase().includes(q) || (m.phone||'').includes(q));
  if(state.memberFilter === 'active') list = list.filter(m => m.status === 'active' && m.approvalStatus === 'approved');
  else if(state.memberFilter === 'pending') list = list.filter(m => m.approvalStatus === 'pending_approval');
  else if(state.memberFilter === 'expired') list = list.filter(m => m.status === 'expired');
  else if(state.memberFilter === 'blocked') list = list.filter(m => m.status === 'blocked');
  return `<div class="card"><div class="tb" style="margin-bottom:14px"><div class="sbox"><input class="inp" id="memberSearch" placeholder="Search…" value="${esc(state.query)}"></div><div class="chips">${[['all','All'],['active','Active'],['pending','Pending'],['expired','Expired'],['blocked','Blocked']].map(([k,l])=>`<button class="chip ${state.memberFilter===k?'on':''}" data-act="mfilter" data-f="${k}">${l}</button>`).join('')}</div><div class="sp" style="flex:1"></div><button class="btn acc" data-act="member-add">${icon('plus',14)} Add</button></div>${list.length?`<div class="tw"><table><thead><tr><th>Member</th><th>Plan</th><th>Ends</th><th>Face</th><th>Status</th><th></th></tr></thead><tbody>${list.map(m=>{const d=daysBetween(today(),m.endDate);const pl=gymPlans()[m.plan]||{label:m.plan};return `<tr data-act="member-open" data-id="${m.id}"><td><div class="cm">${avatar(m.name,34,m.profileImage)}<div><div class="nm">${esc(m.name)}</div><div class="em">${esc(m.email)}</div></div></div></td><td><span class="badge" style="background:${PLAN_COLORS[m.plan]||'#c6ff3d'}1f;color:${PLAN_COLORS[m.plan]||'#c6ff3d'}">${esc(pl.label)}</span></td><td style="font-size:12px">${fmtDate(m.endDate)}<div style="font-size:10.5px;color:var(--muted)">${!isNaN(d)?(d>=0?d+'d':'expired'):'—'}</div></td><td>${m.faceEnrolled?'<span class="badge acc">✓</span>':'<span class="badge">—</span>'}</td><td>${statusPill(m)}</td><td onclick="event.stopPropagation()"><div style="display:flex;gap:5px;justify-content:flex-end"><button class="ib" data-act="member-edit" data-id="${m.id}">${icon('edit',13)}</button><button class="ib d" data-act="member-del" data-id="${m.id}">${icon('trash',13)}</button></div></td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">No members</div>`}</div>`;

function viewFaceAccess(){
  const g = G(); if(!g) return `<div class="empty">No gym</div>`;
  const ms = g.members || [];
  const d = g.lockDevice || {};
  return `<div class="grid g4">${statCard('Enrolled', ms.filter(m=>m.faceEnrolled).length,'scan','#3ddc97')}${statCard('Pending', ms.filter(m=>m.approvalStatus==='pending_approval').length,'clock','#ffb340')}${statCard('Door ON', ms.filter(m=>m.doorAccess).length,'unlock','#c6ff3d')}${statCard('Lock', d.enabled?'On':'Off','lock',d.enabled?'#3ddc97':'#ff5252')}</div>
  <div class="card"><div class="ch"><h3>Member Flow</h3></div><div class="flow">${ms.slice(0,20).map(m=>{
    let step=1,cls='';
    if(m.approvalStatus==='approved'&&m.faceEnrolled&&m.doorAccess){step=4;cls='done';}
    else if(m.approvalStatus==='approved'&&m.faceEnrolled){step=3;cls='cur';}
    else if(m.approvalStatus==='face_pending'){step=2;cls='cur';}
    else {step=1;cls='cur';}
    const labels=['','Awaiting payment','Awaiting face scan','Awaiting door','Full access'];
    return `<div class="fs ${cls}"><div class="n">${step===4?'✓':step}</div><div class="b"><div class="t">${esc(m.name)}</div><div class="s">${labels[step]}</div></div>${step===1?`<button class="btn acc sm" data-act="member-approve" data-id="${m.id}">Verify</button>`:''}${step===3?`<button class="btn acc sm" data-act="member-door-on" data-id="${m.id}">Enable</button>`:''}</div>`;
  }).join('')||'<div class="empty">No members</div>'}</div></div>`;
}

async function approveMember(id){
  const g = G(); if(!g) return;
  const m = (g.members||[]).find(x => x.id === id); if(!m) return;
  const payments = (m.payments||[]).map(p => p.status !== 'paid' ? {...p, status:'paid', verifiedAt: today()} : p);
  const patch = { payments, paymentVerified: true, approvedAt: today() };
  if(m.status === 'expired'){
    const mp = gymPlans()[m.plan] || { days: 30 };
    patch.status = 'active';
    patch.endDate = addDays(today(), mp.days);
    patch.approvalStatus = m.faceEnrolled ? 'approved' : 'face_pending';
  } else {
    patch.approvalStatus = m.faceEnrolled ? 'approved' : 'face_pending';
  }
  try {
    await updateDoc(doc(db,'gyms',g.id,'members',id), patch);
    Object.assign(m, patch);
    render(); toast('Approved ✓');
    if($('#modalRoot').innerHTML.includes('mh')) renderDetail();
  } catch(err){ toast('Failed: ' + err.message, 'err'); }
}

async function doorOn(id){
  const g = G(); const m = (g.members||[]).find(x => x.id === id); if(!m) return;
  if(m.status !== 'active' || m.approvalStatus !== 'approved' || m.paymentVerified !== true || !m.faceEnrolled){ toast('Requirements not met','err'); return; }
  try {
    await updateDoc(doc(db,'gyms',g.id,'members',id), { doorAccess: true });
    m.doorAccess = true;
    render(); toast('Door enabled ✓');
    if($('#modalRoot').innerHTML.includes('mh')) renderDetail();
  } catch (err) { toast('Failed: ' + err.message, 'err'); }
}

async function doorOff(id){
  const g = G(); const m = (g.members||[]).find(x => x.id === id); if(!m) return;
  try {
    await updateDoc(doc(db,'gyms',g.id,'members',id), { doorAccess: false });
    m.doorAccess = false;
    render(); toast('Door disabled','warn');
    if($('#modalRoot').innerHTML.includes('mh')) renderDetail();
  } catch (err) { toast('Failed: ' + err.message, 'err'); }
}

// AUTH HANDLERS
// ═══════════════════════════════════════════════════════════════════════

function bindAuth(){
  const f = $('#loginForm'); if(!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(f);
    const identifier = String(fd.get('identifier')||'').trim().toLowerCase();
    const pw = String(fd.get('password')||'');
    if(!identifier || !pw){ state.authError='Enter credentials'; render(); return; }
    handleLogin(identifier, pw);
  });
}

async function handleLogin(identifier, pw){
  state.authError = '';
  try {
    const cred = await signInWithEmailAndPassword(auth, identifier, pw);
    await hydrateAfterLogin(cred.user);
  } catch (err) {
    state.authError =
      err.code === 'auth/invalid-credential' ? 'Invalid credentials' :
      err.code === 'auth/user-not-found'     ? 'User not found' :
      err.code === 'auth/wrong-password'     ? 'Wrong password' :
      err.code === 'auth/network-request-failed' ? 'Network error' :
      err.message || 'Login failed';
    render();
  }
}

async function googleSignIn(){
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const result = await signInWithPopup(auth, provider);
    await hydrateAfterLogin(result.user);
  } catch (err) {
    toast('Google Sign-In failed: ' + (err.message||err.code), 'err');
  }
}

async function hydrateAfterLogin(user){
  try {
    const profileSnap = await getDoc(doc(db,'users',user.uid)).catch(()=>null);
    const profile = profileSnap?.exists() ? profileSnap.data() : null;
    const isSuperEmail = (user.email || '').toLowerCase() === SUPER_EMAIL.toLowerCase();

    if(isSuperEmail){
      if(!profile){
        state.authError = 'Superadmin profile missing. Create users/{uid} in Firebase Console with role:"superadmin".';
        await signOut(auth);
        render(); return;
      }
      if(profile.role !== 'superadmin'){
        await signOut(auth);
        state.authError = 'Access denied';
        render(); return;
      }
      state.auth = { role:'superadmin', email:user.email, gymId:null, memberId:null, uid:user.uid };
      state.gyms = await loadAllGymsForSA();
      state.route = 'sa-dash';
    } else if(profile?.role === 'gymowner'){
      if(!profile.gymId){ await signOut(auth); state.authError='Gym not linked'; render(); return; }
      const gym = await loadGymBundle(profile.gymId).catch(()=>null);
      if(!gym){ await signOut(auth); state.authError='Gym not found'; render(); return; }
      if(gym.status === 'blocked' || !gym.approved){
        await signOut(auth);
        state.authError = gym.status === 'blocked' ? 'Gym blocked' : 'Gym not approved yet';
        render(); return;
      }
      state.auth = { role:'gymowner', email:user.email, gymId:profile.gymId, memberId:null, uid:user.uid };
      state.gyms = [gym];
      state.currentGymId = profile.gymId;
      state.route = 'dashboard';
    } else if(profile?.role === 'member'){
      if(!profile.gymId || !profile.memberId){ await signOut(auth); state.authError='Member not linked'; render(); return; }
      const gym = await loadGymBundle(profile.gymId).catch(()=>null);
      if(!gym){ await signOut(auth); state.authError='Gym not found'; render(); return; }
      const m = (gym.members||[]).find(x => x.id === profile.memberId);
      if(!m){ await signOut(auth); state.authError='Member not found'; render(); return; }
      if(m.status === 'blocked'){ await signOut(auth); state.authError='Membership blocked'; render(); return; }
      if(m.status === 'expired'){ toast(`Membership expired ${fmtDate(m.endDate)} — renew to restore`, 'warn'); }
      state.auth = { role:'member', email:user.email, gymId:profile.gymId, memberId:profile.memberId, uid:user.uid };
      state.gyms = [gym];
      state.currentGymId = profile.gymId;
      state.cart = [];
      state.route = 'm-home';
    } else {
      state.authError = 'No profile found. Register or contact admin.';
      await signOut(auth);
      render(); return;
    }
    render(); toast('Welcome back');
  } catch (err) {
    toast('Login failed: ' + (err.message||err.code), 'err');
  }
}

async function logoutUser(){
  try { await signOut(auth); } catch(e) {}
  state.auth = { role:null, email:null, gymId:null, memberId:null, uid:null };
  state.gyms = [];
  state.route = 'sa-dash';
  state.cart = [];
  state.publicGymId = null;
  state.aiChat = [];
  state.showGymDir = false;
  state._superInbox = [];
  closeModal();
  render();
  toast('Signed out');
}

document.addEventListener('click', async e => {
  // 9-click superadmin trigger
  if(e.target.closest('#saLogoTrigger') && !isAuth()){
    state._saClicks = (state._saClicks || 0) + 1;
    const hint = document.getElementById('saLogoHint');
    if(hint){
      const remaining = 9 - state._saClicks;
      hint.textContent = remaining > 0 ? `${remaining} more…` : '✓';
      hint.style.opacity = '1';
      setTimeout(() => { if(hint) hint.style.opacity = '0'; }, 1200);
    }
    if(state._saClicks >= 9){
      state._saClicks = 0;
      openSuperadminLogin();
    }
    clearTimeout(state._saClickTimer);
    state._saClickTimer = setTimeout(() => { state._saClicks = 0; }, 5000);
    return;
  }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  try {
    switch(act){
      case 'toggle-menu': { const s = $('#sidebar'); if(s) s.classList.toggle('expanded'); break; }
      case 'google-signin': googleSignIn(); break;
      case 'open-dir': state.gyms = await loadAllPublicGyms(); state.showGymDir = true; render(); break;
      case 'close-dir': state.showGymDir = false; render(); break;
      case 'open-gym-dir': state.publicGymId = id; state.showGymDir = false; state.pendingRefCode = null; closeModal(); render(); break;
      case 'back-to-login': state.publicGymId = null; state.pendingRefCode = null; state.showGymDir = false; render(); break;
      case 'register-gym': registerGymPublic(); break;
      case 'register-member': state.gyms = await loadAllPublicGyms(); registerMemberPublic(el.dataset.gym); break;
      case 'gym-admin-login': openGymAdminLogin(id); break;
      case 'gym-member-login': openGymMemberLogin(id); break;
      case 'toggle-pw': { e.preventDefault(); const t = el.dataset.target; const inp = document.getElementById(t); if(!inp) break; const isPw = inp.type === 'password'; inp.type = isPw ? 'text' : 'password'; el.innerHTML = isPw ? icon('eyeOff',15) : icon('eye',15); break; }
      case 'logout': confirmDialog({title:'Sign Out', message:'Sign out?', confirmText:'Sign Out', danger:false, onConfirm:logoutUser}); break;
      case 'modal-close': closeModal(); break;
      case 'close-modal-bg': if(e.target === el) closeModal(); break;
      case 'nav': state.route = el.dataset.route; render(); window.scrollTo({top:0}); break;
      case 'go-home': { const home = isSA()?'sa-dash':isGO()?'dashboard':'m-home'; state.route = home; closeModal(); render(); break; }
      case 'mfilter': state.memberFilter = el.dataset.f; render(); break;
      case 'metric': state.metric = el.dataset.m; render(); break;
      case 'gym-form': gymForm(id || null); break;
      case 'gym-edit': closeModal(); setTimeout(()=>gymForm(id), 50); break;
      case 'gym-approve': {
        const g = state.gyms.find(x => x.id === id); if(!g) break;
        await saveGym(id, {approved:true, approvedAt:today()}); g.approved = true; g.approvedAt = today();
        render(); toast('Approved ✓');
        break;
      }
      case 'gym-block': {
        const g = state.gyms.find(x => x.id === id); if(!g) break;
        const newStatus = g.status === 'blocked' ? 'active' : 'blocked';
        confirmDialog({title:newStatus==='blocked'?'Block':'Unblock', message:`${newStatus==='blocked'?'Block':'Unblock'} ${esc(g.name)}?`, confirmText:newStatus==='blocked'?'Block':'Unblock', danger:newStatus==='blocked', onConfirm:async()=>{
          await saveGym(id, {status:newStatus}); g.status = newStatus; render(); toast('Done');
        }});
        break;
      }
      case 'gym-del': {
        const g = state.gyms.find(x => x.id === id); if(!g) break;
        confirmDialog({title:'Delete Gym', message:`Delete "${esc(g.name)}" permanently?`, onConfirm:async()=>{
          for(const m of g.members||[]) await deleteDoc(doc(db,'gyms',id,'members',m.id)).catch(()=>{});
          for(const p of g.products||[]) await deleteDoc(doc(db,'gyms',id,'products',p.id)).catch(()=>{});
          await deleteDoc(doc(db,'gyms',id)).catch(()=>{});
          await deleteDoc(doc(db,'public_gyms',id)).catch(()=>{});
          state.gyms = state.gyms.filter(x => x.id !== id);
          render(); toast('Deleted','err');
        }});
        break;
      }
      case 'member-add': memberForm(); break;
      case 'member-edit': closeModal(); setTimeout(()=>memberForm(id), 50); break;
      case 'member-open': closeModal(); openMemberDetail(id); break;
      case 'member-approve': await approveMember(id); break;
      case 'member-door-on': await doorOn(id); break;
      case 'member-door-off': await doorOff(id); break;
      case 'member-del': {
        const g = G(); const m = (g.members||[]).find(x => x.id === id); if(!m) break;
        confirmDialog({title:'Delete Member', message:`Delete "${esc(m.name)}"?`, onConfirm:async()=>{
          await deleteDoc(doc(db,'gyms',g.id,'members',id));
          g.members = g.members.filter(x => x.id !== id);
          closeModal(); render(); toast('Member deleted','err');
        }});
        break;
      }
      case 'product-add': productForm(); break;
      case 'product-edit': closeModal(); setTimeout(()=>productForm(id), 50); break;
      case 'product-del': {
        const g = G(); const p = (g.products||[]).find(x => x.id === id); if(!p) break;
        confirmDialog({title:'Delete', message:`Delete ${esc(p.name)}?`, onConfirm:async()=>{
          await deleteDoc(doc(db,'gyms',g.id,'products',id));
          g.products = g.products.filter(x => x.id !== id);
          render(); toast('Deleted','err');
        }});
        break;
      }
      case 'cart-add': { const g = G(); const p = (g.products||[]).find(x => x.id === id); if(!p) break; const ec = state.cart.find(c => c.productId === id); if(ec) ec.qty++; else state.cart.push({productId:id, qty:1}); toast(`${p.name} added`); render(); break; }
      case 'cart-inc': { const c = state.cart.find(x => x.productId === id); if(c) c.qty++; render(); break; }
      case 'cart-dec': { const c = state.cart.find(x => x.productId === id); if(!c) break; c.qty--; if(c.qty <= 0) state.cart = state.cart.filter(x => x.productId !== id); render(); break; }
      case 'mark-paid': {
        const g = G(); const m = me(); if(!g||!m) break;
        const amount = parseFloat(el.dataset.amount)||0;
        const note = el.dataset.note || 'Payment';
        const newPay = {id:uid(), date:today(), amount, method:'UPI', note, status:'pending'};
        await updateDoc(doc(db,'gyms',g.id,'members',m.id), { payments: [...(m.payments||[]), newPay] });
        await notifyGym(g, 'whatsapp', g.ownerPhone || 'admin', `${m.name} paid ${money(amount)} — awaiting verification`);
        toast('Recorded ✓'); state.gyms = [await loadGymBundle(g.id)]; render();
        break;
      }
      case 'copy': { try { await navigator.clipboard.writeText(el.dataset.copy); toast('Copied!'); } catch(err) { toast('Failed','err'); } break; }
      case 'chat-send': sendChat(); break;
      case 'ai-insight': aiInsight(id); break;
      case 'ai-save': {
        const p = $('#aiProvider').value;
        const k = $('#aiKey').value.trim();
        if(!k){ toast('Key required','err'); break; }
        state.aiConfig = { provider: p, key: k, model: p === 'groq' ? 'llama-3.3-70b-versatile' : 'gemini-2.0-flash' };
        try { localStorage.setItem('migym_ai', JSON.stringify(state.aiConfig)); toast('Saved ✓'); } catch(e){ toast('Failed','err'); }
        break;
      }
      case 'sa-save-upi': {
        const v = ($('#saUpiId')?.value || '').trim();
        const n = ($('#saUpiName')?.value || '').trim() || 'MiGym Platform';
        if(!VALID_UPI.test(v)){ toast('Invalid UPI format','err'); break; }
        await setDoc(doc(db,'system','config'), { superUpiId: v, superUpiName: n }, {merge:true});
        state.platformConfig.superUpiId = v;
        state.platformConfig.superUpiName = n;
        render(); showSuccess('UPI Saved', v);
        break;
      }
      case 'sa-test-upi': {
        const upi = state.platformConfig.superUpiId;
        if(!VALID_UPI.test(upi)){ toast('Save valid UPI first','err'); break; }
        const link = safeUpiUrl('upi://pay', { pa: upi, pn: state.platformConfig.superUpiName || 'MiGym', am: '1.00', cu: 'INR', tn: 'Test' });
        if(link){ const a = document.createElement('a'); a.href = link; a.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500); }
        break;
      }
      case 'face-cam-stop': {
        if(window.__faceStream){ window.__faceStream.getTracks().forEach(t => t.stop()); window.__faceStream = null; }
        break;
      }
      case 'face-cam-capture': {
        const g = G(); const m = me(); if(!g||!m) break;
        const video = $('#faceVideo'); if(!video) break;
        if(!window.__faceStream){
          try { window.__faceStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); video.srcObject = window.__faceStream; video.play().catch(()=>{}); await new Promise(r=>setTimeout(r, 900)); }
          catch (err) { toast('Camera denied: ' + err.message,'err'); break; }
        }
        try {
          const tpl = await computeFaceTemplate(video);
          if(!tpl) throw new Error('Could not capture');
          if(window.__faceStream){ window.__faceStream.getTracks().forEach(t => t.stop()); window.__faceStream = null; }
          await updateDoc(doc(db,'gyms',g.id,'members',m.id), { faceEnrolled: true, faceEnrolledAt: today(), faceTemplateId: 'TPL-' + uid().toUpperCase(), faceTemplateHash: tpl });
          state.gyms = [await loadGymBundle(g.id)];
          render(); showSuccess('Face Enrolled', 'Ask gym owner to approve face access.');
        } catch (err) { toast('Capture failed: ' + err.message,'err'); }
        break;
      }
      case 'face-cam-scan': {
        const g = G(); const m = me(); if(!g||!m) break;
        const video = $('#faceVideo'); if(!video) break;
        if(!window.__faceStream){
          try { window.__faceStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); video.srcObject = window.__faceStream; video.play().catch(()=>{}); await new Promise(r=>setTimeout(r, 900)); }
          catch (err) { toast('Camera denied: ' + err.message,'err'); break; }
        }
        try {
          const tpl = await computeFaceTemplate(video);
          if(window.__faceStream){ window.__faceStream.getTracks().forEach(t => t.stop()); window.__faceStream = null; }
          if(!hammingMatches(m.faceTemplateHash || '', tpl)){ toast('No match','err'); break; }
          toast('Face verified ✅');
          if(!m.doorAccess){ toast('Door access not enabled','warn'); break; }
          toast('🚪 Access granted','');
        } catch (err) { toast('Scan failed: ' + err.message,'err'); }
        break;
      }
    }
  } catch (err) {
    console.error('Click handler error:', err);
    toast('Error: ' + (err.message || 'Unknown'), 'err');
  }
});

// ═══════════════════════════════════════════════════════════════════════
// INPUT / CHANGE HANDLERS
// ═══════════════════════════════════════════════════════════════════════

let _searchTimer = null;
document.addEventListener('input', e => {
  if(e.target.id !== 'memberSearch') return;
  state.query = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    const pos = e.target.selectionStart;
    render();
    const i = $('#memberSearch');
    if(i){ i.focus(); try{ i.setSelectionRange(pos, pos); }catch(_){} }
  }, 150);
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key === 'Enter' && e.target.id === 'chatInput' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});

// ═══════════════════════════════════════════════════════════════════════
// SUBMIT HANDLERS
// ═══════════════════════════════════════════════════════════════════════

document.addEventListener('submit', async e => {
  const t = e.target.id;

  if(t === 'saLoginForm'){
    e.preventDefault();
    const f = new FormData(e.target);
    const email = (f.get('identifier')||'').trim().toLowerCase();
    const pw = String(f.get('password')||'');
    const errEl = $('#saLoginError');
    if(errEl) errEl.style.display = 'none';
    if(email !== SUPER_EMAIL.toLowerCase()){
      if(errEl){ errEl.textContent = 'Access denied'; errEl.style.display = 'flex'; }
      return;
    }
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      closeModal();
      await hydrateAfterLogin(cred.user);
    } catch (err) {
      if(errEl){ errEl.textContent = err.code === 'auth/invalid-credential' ? 'Invalid credentials' : (err.message || 'Failed'); errEl.style.display = 'flex'; }
    }
    return;
  }

  if(t === 'platformPlansForm'){
    e.preventDefault();
    const f = new FormData(e.target);
    Object.keys(state.superadminPlans).forEach(k => {
      state.superadminPlans[k] = {
        ...state.superadminPlans[k],
        label: f.get('label_'+k) || state.superadminPlans[k].label,
        price: parseFloat(f.get('price_'+k)) || 0,
        days: parseInt(f.get('days_'+k)) || 30,
        enabled: f.get('en_'+k) === 'on'
      };
    });
    try { await setDoc(doc(db,'system','plans'), state.superadminPlans, {merge:true}); toast('Plans updated ✓'); render(); }
    catch(err){ toast('Failed: ' + err.message, 'err'); }
    return;
  }

  if(t === 'memberPlansForm'){
    e.preventDefault();
    const g = G(); if(!g) return;
    const f = new FormData(e.target);
    const next = {...g.memberPlans};
    PLAN_KEYS.forEach(k => { next[k] = {...next[k], price:parseFloat(f.get('price_'+k))||0, days:parseInt(f.get('days_'+k))||30}; });
    try { await saveGym(g.id, {memberPlans:next}); g.memberPlans = next; toast('Plans updated ✓'); render(); }
    catch(err){ toast('Failed: ' + err.message, 'err'); }
    return;
  }

  if(t === 'gymAdminLoginForm'){
    e.preventDefault();
    const f = new FormData(e.target);
    const gid = e.target.dataset.gymid;
    const email = (f.get('identifier')||'').trim().toLowerCase();
    try {
      const cred = await signInWithEmailAndPassword(auth, email, f.get('password'));
      const profileSnap = await getDoc(doc(db,'users',cred.user.uid));
      if(!profileSnap.exists() || profileSnap.data().gymId !== gid || profileSnap.data().role !== 'gymowner'){
        await signOut(auth); const errEl = $('#gymAdminLoginError'); if(errEl){ errEl.textContent="Not this gym's owner"; errEl.style.display='flex'; } return;
      }
      closeModal();
      await hydrateAfterLogin(cred.user);
    } catch (err) {
      const errEl = $('#gymAdminLoginError');
      if(errEl){ errEl.textContent = err.code==='auth/invalid-credential' ? 'Invalid credentials' : err.message; errEl.style.display='flex'; }
    }
    return;
  }

  if(t === 'gymMemberLoginForm'){
    e.preventDefault();
    const f = new FormData(e.target);
    const gid = e.target.dataset.gymid;
    const email = (f.get('username')||'').trim().toLowerCase();
    try {
      const cred = await signInWithEmailAndPassword(auth, email, f.get('password'));
      const profileSnap = await getDoc(doc(db,'users',cred.user.uid));
      if(!profileSnap.exists() || profileSnap.data().gymId !== gid || profileSnap.data().role !== 'member'){
        await signOut(auth); const errEl = $('#gymLoginError'); if(errEl){ errEl.textContent="Not this gym's member"; errEl.style.display='flex'; } return;
      }
      closeModal();
      await hydrateAfterLogin(cred.user);
    } catch (err) {
      const errEl = $('#gymLoginError');
      if(errEl){ errEl.textContent = err.code==='auth/invalid-credential' ? 'Invalid credentials' : err.message; errEl.style.display='flex'; }
    }
    return;
  }

  if(t === 'gymProfileForm'){
    e.preventDefault();
    const g = G(); if(!g) return;
    const f = new FormData(e.target);
    const patch = {name:f.get('name').trim(), city:f.get('city').trim(), phone:f.get('phone').trim(), address:f.get('address').trim(), upiId:f.get('upiId').trim()};
    try { await saveGym(g.id, patch); Object.assign(g, patch); toast('Saved ✓'); render(); }
    catch(err){ toast('Failed: ' + err.message, 'err'); }
    return;
  }
});

// ═══════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════

try {
  const saved = localStorage.getItem('migym_ai');
  if(saved) state.aiConfig = JSON.parse(saved);
} catch(e){}

onAuthStateChanged(auth, async user => {
  if(!user) return;
  if(state.auth.uid && state.auth.uid === user.uid) return;
  try { await hydrateAfterLogin(user); } catch (e) { console.warn('Auth hydrate', e); }
});

(async function init(){
  try { render(); } catch(e){ console.error('Initial render', e); }
  try {
    const sys = await loadSystemBundle();
    if(sys.config) state.platformConfig = {
      superUpiId: sys.config.superUpiId || '',
      superUpiName: sys.config.superUpiName || 'MiGym Platform'
    };
    if(sys.flags) state.flags = { ...state.flags, ...sys.flags };
    if(sys.plans) state.superadminPlans = sys.plans;
  } catch(e){ console.warn('System bundle', e); }
  try { state.gyms = await loadAllPublicGyms(); } catch(e){ state.gyms = []; }
  const params = new URLSearchParams(window.location.search);
  if(params.has('gym')) state.publicGymId = params.get('gym');
  if(params.has('ref')) state.pendingRefCode = params.get('ref');
  if(state.publicGymId){
    try { const g = await loadGymBundle(state.publicGymId); state.gyms = [g]; }
    catch(e){ console.warn('Public gym load', e); }
  }
  render();
  console.log('%c MiGym Pro · Ready ','background:#c6ff3d;color:#0b0d07;font-weight:800;padding:2px 6px;border-radius:4px');
})();

window.addEventListener('popstate', () => {
  if($('#modalRoot').innerHTML){ closeModal(); history.pushState(null,'',location.href); return; }
  if(state.publicGymId){ state.publicGymId = null; render(); history.pushState(null,'',location.href); return; }
  if(isAuth()){
    const home = isSA()?'sa-dash':isGO()?'dashboard':'m-home';
    if(state.route !== home){ state.route = home; render(); }
    history.pushState(null,'',location.href);
  }
});
history.pushState(null,'',location.href);
</script>
