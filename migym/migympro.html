<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiGym Pro — Enterprise Edition</title>
<meta name="theme-color" content="#07080a">
<!-- CSP: only exact hosts the app talks to -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.qrserver.com https://res.cloudinary.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://api.cloudinary.com https://api.groq.com https://api.openai.com https://generativelanguage.googleapis.com; frame-src https://*.firebaseapp.com https://www.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiGym Pro">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#07080a;color:#e9edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
input,textarea,select,button{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#262b36;border-radius:8px}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em;line-height:1.2}
img{max-width:100%;display:block}
:root{--bg:#07080a;--panel:#0f1115;--panel2:#151821;--panel3:#1b1f29;--line:#20242d;--line2:#2b303b;--txt:#e9edf3;--muted:#7f8899;--muted2:#5a6273;--acc:#c6ff3d;--grn:#3ddc97;--dgr:#ff5252;--wrn:#ffb340;--inf:#4d9dff;--pur:#a78bfa;--r:14px;--sh:0 12px 40px rgba(0,0,0,.5)}
.auth{position:fixed;inset:0;z-index:500;background:radial-gradient(80% 60% at 50% -10%,rgba(198,255,61,.09),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.acard{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--sh)}
.abrand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px}
.mk{width:44px;height:44px;border-radius:13px;background:linear-gradient(140deg,var(--acc),#7bbf00);display:grid;place-items:center;color:#0a0c07;overflow:hidden;cursor:pointer}
.mk img{width:100%;height:100%;object-fit:cover}
.bn{font-size:20px;font-weight:800;letter-spacing:.06em}
.bs{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.atitle{text-align:center;font-size:21px;font-weight:800;margin-bottom:6px}
.asub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px}
.aerr{background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);color:#ff8080;border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:650;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.afoot{text-align:center;font-size:11px;color:var(--muted2);margin-top:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:10px 11px;font-size:16px;outline:none;transition:.15s}
@media (min-width:861px){.inp{font-size:13px}}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(198,255,61,.1)}
.pw{position:relative}
.pw .inp{padding-right:44px}
.pwt{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:650;font-size:13px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);transition:.15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel3)}
.btn.acc{background:var(--acc);color:#0b0d07;border-color:var(--acc)}
.btn.dgr{background:rgba(255,82,82,.12);border-color:rgba(255,82,82,.35);color:#ff8080}
.btn.gho{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.blk{width:100%}
.btn.ai{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-color:#7c3aed}
.btn.wrn{background:rgba(255,179,64,.15);border-color:rgba(255,179,64,.4);color:#ffc163}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted);background:var(--panel2);border:1px solid transparent;flex-shrink:0;position:relative}
.ib:hover{background:var(--panel3);color:var(--txt)}
.ib.d:hover{color:#ff8080;background:rgba(255,82,82,.12)}
.ib .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--dgr);box-shadow:0 0 8px var(--dgr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{font-size:14px}
.ch .sp{flex:1}
.ch .sub{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:8px}
.stat .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2)}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.stat .val{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .dlt{font-size:11.5px;font-weight:650;display:flex;align-items:center;gap:4px}
.up{color:var(--grn)}.down{color:var(--dgr)}.neu{color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
.cm{display:flex;align-items:center;gap:10px;min-width:0}
.cm .nm{font-weight:650;font-size:13px;white-space:nowrap}
.cm .em{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.02em;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.active{background:rgba(61,220,151,.12);color:#4fe3a4}
.pill.expired{background:rgba(255,179,64,.12);color:#ffc163}
.pill.blocked{background:rgba(255,82,82,.13);color:#ff7b7b}
.pill.pending{background:rgba(167,139,250,.13);color:#b8a3ff}
.pill.facescan{background:rgba(77,157,255,.13);color:#7bb6ff}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;background:var(--panel3);color:var(--muted);border:1px solid var(--line2)}
.badge.acc{background:rgba(198,255,61,.12);color:var(--acc);border-color:rgba(198,255,61,.25)}
.badge.inf{background:rgba(77,157,255,.12);color:#7bb6ff;border-color:rgba(77,157,255,.25)}
.badge.wrn{background:rgba(255,179,64,.12);color:#ffc163;border-color:rgba(255,179,64,.25)}
.badge.dgr{background:rgba(255,82,82,.12);color:#ff8080;border-color:rgba(255,82,82,.3)}
.ov{position:fixed;inset:0;background:rgba(3,4,6,.78);backdrop-filter:blur(6px);z-index:700;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.lg{max-width:820px}
.modal.xl{max-width:1000px}
.mh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.mh h3{font-size:15px}
.mh .sp{flex:1}
.mh .sub{font-size:12px;color:var(--muted)}
.mb{padding:18px;flex:1;overflow-y:auto;min-height:0}
.mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0}
.modal>form{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.modal>form>.mb{flex:1;min-height:0;overflow-y:auto}
#toast{position:fixed;bottom:22px;right:22px;z-index:900;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:10px 14px;border-radius:9px;font-size:12.5px;font-weight:600;box-shadow:var(--sh);max-width:340px;pointer-events:auto}
.toast.err{border-left-color:var(--dgr)}
.toast.warn{border-left-color:var(--wrn)}
.aor{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.aor::before,.aor::after{content:'';flex:1;height:1px;background:var(--line2)}
.areg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.upi-box{background:rgba(0,0,0,.3);border:1px dashed var(--line2);border-radius:12px;padding:16px;margin-top:16px}
.upi-box-header{font-size:12px;font-weight:800;color:var(--acc);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.upi-amount{font-size:26px;font-weight:800;margin-bottom:4px}
.upi-id{font-size:12px;color:var(--muted);margin-bottom:14px}
.upi-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.upi-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;font-size:11px;font-weight:600;text-decoration:none;color:var(--txt);transition:.15s}
.upi-btn:hover{border-color:var(--acc);background:var(--panel3)}
.upi-btn:not([href]),.upi-btn[href=""]{opacity:.5;pointer-events:none}
.upi-btn .ico{font-size:22px}
.paid-check{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;cursor:pointer;padding:12px;background:rgba(61,220,151,.1);border-radius:8px;border:1px solid rgba(61,220,151,.2)}
.paid-check input{width:18px;height:18px;accent-color:var(--grn);flex-shrink:0;cursor:pointer}
.photo-cap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:var(--panel2);border:1px dashed var(--line2);border-radius:12px;text-align:center}
.photo-cap .preview{width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--panel3);display:grid;place-items:center;position:relative;border:2px solid var(--line2)}
.photo-cap .preview img{width:100%;height:100%;object-fit:cover}
.photo-cap .preview .ic{font-size:36px;color:var(--muted)}
.photo-cap input[type="file"]{display:none}
.cam-view{width:100%;max-width:320px;aspect-ratio:1;background:#000;border-radius:16px;overflow:hidden;position:relative;margin:0 auto;border:2px solid var(--line2)}
.cam-view video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-overlay{position:absolute;inset:0;border:40px solid rgba(0,0,0,.4);border-radius:50%;pointer-events:none}
.scan-line{position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:scan 2s linear infinite}
@keyframes scan{0%{top:10%}50%{top:90%}100%{top:10%}}
.plan-card{transition:.15s}
.plan-card:hover{border-color:var(--acc) !important}
.ban{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.ban.inf{background:rgba(77,157,255,.08);border-color:rgba(77,157,255,.3)}
.ban.dng{background:rgba(255,82,82,.08);border-color:rgba(255,82,82,.3)}
.ban.suc{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)}
.ban .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex-shrink:0}
.ban h3{font-size:14px;margin-bottom:2px}
.ban p{font-size:12px;color:var(--muted)}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;border-top:3px solid var(--gc)}
.gcard.blocked{opacity:.7}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gn{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gc{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sd{width:8px;height:8px;border-radius:50%;background:var(--dgr);flex-shrink:0}
.sd.active{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;font-size:11px}
.gs .k{color:var(--muted);margin-bottom:2px}
.gs .v{font-weight:800;font-size:14px}
.gf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.gf .sp{flex:1}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr img{width:120px;height:120px;border-radius:12px;background:#fff;padding:8px;flex-shrink:0}
.qr-meta{flex:1;min-width:200px}
.qr-url{font-family:monospace;font-size:11px;background:var(--panel2);padding:8px 10px;border-radius:8px;word-break:break-all;border:1px solid var(--line);margin-bottom:10px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbox{position:relative;flex:1;min-width:200px;max-width:320px}
.sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox .inp{padding-left:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);cursor:pointer}
.chip.on{background:rgba(198,255,61,.15);border-color:var(--acc);color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.kpi .v{font-size:18px;font-weight:800}
.bmi{display:flex;align-items:center;gap:14px;padding:14px;background:var(--panel2);border-radius:12px;border:1px solid var(--line2)}
.bmi .big{font-size:32px;font-weight:800}
.bmi .meta .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.bmi .meta .c{font-size:14px;font-weight:800}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ig .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:2px}
.ig .v{font-weight:700;font-size:13px;word-break:break-all}
.div{height:1px;background:var(--line);margin:16px 0}
.empty{padding:36px 18px;text-align:center;color:var(--muted2);font-size:13px;border:1px dashed var(--line2);border-radius:10px}
.list{display:flex;flex-direction:column}
.lr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:none}
.lr .g{flex:1;min-width:0}
.lr .t{font-weight:650;font-size:13px}
.lr .s{font-size:11px;color:var(--muted)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pi{aspect-ratio:1;background:var(--panel2);display:grid;place-items:center;font-size:48px;position:relative}
.pi img{width:100%;height:100%;object-fit:cover}
.pi .stock{position:absolute;top:8px;right:8px}
.pb{padding:12px;flex:1}
.pc{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px}
.pb h3{font-size:14px;margin-bottom:6px}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pf .price{font-weight:800;font-size:16px;color:var(--acc)}
.pa{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:4px;border:1px solid var(--line2)}
.qty button{width:24px;height:24px;border-radius:6px;background:var(--panel3);display:grid;place-items:center;font-weight:800}
.qty .n{font-weight:800;min-width:20px;text-align:center;font-size:13px}
.flow{display:flex;flex-direction:column;gap:8px}
.fs{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line2)}
.fs.done{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)}
.fs.cur{background:rgba(198,255,61,.08);border-color:rgba(198,255,61,.35)}
.fs .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);font-weight:800;font-size:12px;flex-shrink:0}
.fs.done .n{background:var(--grn);color:#0b0d07}
.fs.cur .n{background:var(--acc);color:#0b0d07}
.fs .b{flex:1}
.fs .t{font-weight:700;font-size:13px}
.fs .s{font-size:11px;color:var(--muted)}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mc{padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.mc .d{width:8px;height:8px;border-radius:50%}
.mc.on{background:var(--panel3);color:var(--txt);border-color:var(--line2);box-shadow:0 0 0 1px var(--txt) inset}
.ai-insight{background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(124,58,237,.04));border:1px solid rgba(167,139,250,.3);border-radius:12px;padding:14px;margin-top:14px}
.ai-insight-head{font-size:12px;font-weight:800;color:var(--pur);margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.05em}
.ai-insight-body{font-size:13px;line-height:1.6;white-space:pre-wrap}
.chat{display:flex;flex-direction:column;height:calc(100vh - 280px);min-height:320px;max-height:560px}
.cscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px;margin-bottom:10px}
.cmsg{display:flex;gap:8px;align-items:flex-start}
.cmsg.user{flex-direction:row-reverse}
.cmsg .who{width:28px;height:28px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:11px;flex-shrink:0;overflow:hidden}
.cmsg.user .who{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
.cmsg.ai .who{background:var(--acc);color:#0b0d07}
.cmsg .bub{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;max-width:85%;white-space:pre-wrap;word-wrap:break-word}

async function computeFaceTemplate(videoEl){
  const c = document.createElement('canvas'); c.width = 9; c.height = 8;
  const x = c.getContext('2d'); x.drawImage(videoEl, 0, 0, 9, 8);
  const d = x.getImageData(0, 0, 9, 8).data;
  let bits = '';
  for (let y = 0; y < 8; y++) {
    for (let xx = 0; xx < 8; xx++) {
      const i = (y * 9 + xx) * 4; const j = (y * 9 + xx + 1) * 4;
      const a = d[i] + d[i+1] + d[i+2]; const b = d[j] + d[j+1] + d[j+2];
      bits += a > b ? '1' : '0';
    }
  }
  return btoa(bits);
}
async function hammingMatches(stored, live) {
  try {
    const a = atob(stored), b = atob(live);
    if(a.length !== b.length) return false;
    let diff = 0;
    for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) diff++;
    return diff <= 12;
  } catch { return false; }
}

  const provider = cfg.provider || 'groq';
  const model = cfg.model || (provider === 'groq' ? 'llama-3.3-70b-versatile' : provider === 'openai' ? 'gpt-4o-mini' : 'gemini-2.0-flash');
  if(provider === 'groq'){
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.key }, body: JSON.stringify({ model, messages:[{role:'system',content:sys},{role:'user',content:user}], temperature:0.7 })});
    if(!r.ok) throw new Error('AI error '+r.status);
    const d = await r.json(); return d.choices?.[0]?.message?.content || '';
  }
  if(provider === 'openai'){
    const r = await fetch('https://api.openai.com/v1/chat/completions', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.key }, body: JSON.stringify({ model, messages:[{role:'system',content:sys},{role:'user',content:user}], temperature:0.7 })});
    if(!r.ok) throw new Error('AI error '+r.status);

function compressImage(file, opts={}){
  const maxDim = opts.maxDim || 640, q = opts.quality || 0.75, maxBytes = opts.maxBytes || 180*1024;
  return new Promise((resolve, reject) => {
    if(!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('Not an image'));
    if(file.size > 5*1024*1024) return reject(new Error('Image too large (max 5 MB)'));
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        try {
          let w = img.width, h = img.height;
          if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
          else   { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
          const c = document.createElement('canvas'); c.width=w; c.height=h;
          const x = c.getContext('2d'); x.fillStyle='#0f1115'; x.fillRect(0,0,w,h);
          x.imageSmoothingQuality='high'; x.drawImage(img, 0, 0, w, h);
          let mime = 'image/webp'; let url = c.toDataURL(mime, q);
          if(!url.startsWith('data:image/webp')){ mime='image/jpeg'; url = c.toDataURL(mime, q); }
          let qq = q;
          while(url.length*0.75 > maxBytes && qq > 0.35){ qq -= 0.1; url = c.toDataURL(mime, qq); }
          resolve({ dataUrl: url });
        } catch(err) { reject(err); }
      };
      img.onerror = () => reject(new Error('Decode failed'));
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

// NOTE: Cloudinary preset is unsigned in this build. For production, sign uploads
// server-side or switch to Firebase Storage. See hardening notes.
async function uploadCompressedImage(file, folder, maxBytes=120*1024){
  const CLOUD_NAME = "ivfmhqkd";
  const UPLOAD_PRESET = "migym_preset";
  const r = await compressImage(file, { maxDim: 480, quality: 0.72, maxBytes });
  try {
    const blob = await (await fetch(r.dataUrl)).blob();
    const formData = new FormData();
    formData.append('file', blob);
    formData.append('upload_preset', UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
    if(!res.ok) throw new Error('Cloudinary upload failed');
    const data = await res.json();
    return data.secure_url;
  } catch (err) {
    console.warn('Cloudinary failed, falling back to Base64', err);
    return r.dataUrl;
  }
}

async function loadGymBundle(gymId){
  const gSnap = await getDoc(doc(db,'gyms',gymId));
  if(!gSnap.exists()) throw new Error('Gym not found');
  const gym = {id:gymId, ...gSnap.data()};
  const [m,p,pr,n,st,ld] = await Promise.all([
    getDocs(collection(db,'gyms',gymId,'members')).catch(()=>({docs:[]})),
    getDocs(collection(db,'gyms',gymId,'products')).catch(()=>({docs:[]})),
    getDocs(collection(db,'gyms',gymId,'promos')).catch(()=>({docs:[]})),
    getDocs(collection(db,'gyms',gymId,'notifications')).catch(()=>({docs:[]})),
    getDocs(collection(db,'gyms',gymId,'staff')).catch(()=>({docs:[]})),
    getDocs(collection(db,'gyms',gymId,'leads')).catch(()=>({docs:[]}))
  ]);
  gym.members       = m.docs.map(d=>({id:d.id,...d.data()}));
  gym.products      = p.docs.map(d=>({id:d.id,...d.data()}));
  gym.promotions    = pr.docs.map(d=>({id:d.id,...d.data()}));
  gym.notifications = n.docs.map(d=>({id:d.id,...d.data()}));
  gym.staff         = st.docs.map(d=>({id:d.id,...d.data()}));
  gym.leads         = ld.docs.map(d=>({id:d.id,...d.data()}));
  gym.settings      = {...DEFAULT_SETTINGS, ...(gym.settings||{})};
  gym.memberPlans   = {...DEFAULT_MEMBER_PLANS, ...(gym.memberPlans||{})};
  gym.socials       = gym.socials || {};
  gym.gallery       = gym.gallery || [];
  gym.lockDevice    = gym.lockDevice || {type:'', name:'', config:{}, enabled:false, lastTest:null};
  gym.faceBrands    = gym.faceBrands || [];
  return gym;
}

  return (g.notifications||[]).filter(n=>n.type!=='super' && !n.read).length;
}

// AUTH

async function hydrateAfterLogin(user){
  try {
    const profileSnap = await getDoc(doc(db,'users',user.uid)).catch(()=>null);
    const profile = profileSnap?.exists() ? profileSnap.data() : null;
    const isSuper = user.uid === SUPER_UID || ((user.email||'').toLowerCase() === SUPER_EMAIL.toLowerCase() && SUPER_UID === 'REPLACE_WITH_SUPERADMIN_UID');

    if(isSuper){
      state.auth = { role:'superadmin', email:user.email, gymId:null, memberId:null, uid:user.uid };
      state.gyms = await loadAllGymsForSA();
      state._superInbox = await loadSuperInbox();
      state.route = 'sa-dash';
    } else if(profile?.role === 'gymowner'){
      const gym = await loadGymBundle(profile.gymId);
      if(gym.status === 'blocked' || !gym.approved){
        await signOut(auth);
        state.authError = gym.status === 'blocked' ? 'Gym blocked' : 'Gym not approved yet';
        render(); return;
      }
      state.auth = { role:'gymowner', email:user.email, gymId:profile.gymId, memberId:null, uid:user.uid };
      state.gyms = [gym]; state.currentGymId = profile.gymId; state.route = 'dashboard';
    } else if(profile?.role === 'member'){
      const gym = await loadGymBundle(profile.gymId);
      const m = (gym.members||[]).find(x => x.id === profile.memberId);
      if(!m){ await signOut(auth); state.authError='Member not found'; render(); return; }
      if(m.status === 'blocked'){ await signOut(auth); state.authError='Membership blocked'; render(); return; }
      if(m.status === 'expired'){ await signOut(auth); state.authError=`Expired ${fmtDate(m.endDate)}`; render(); return; }
      state.auth = { role:'member', email:user.email, gymId:profile.gymId, memberId:profile.memberId, uid:user.uid };
      state.gyms = [gym]; state.currentGymId = profile.gymId; state.cart = []; state.route = 'm-home';
    } else {
      state.authError = 'No profile found.';
      await signOut(auth); render(); return;
    }
    render(); toast('Welcome back');
  } catch (err) {
    toast('Login failed: ' + (err.message||err.code), 'err');
  }
}

async function handleLogin(identifier, pw){
  state.authError = '';
  try {
    const cred = await signInWithEmailAndPassword(auth, identifier, pw);
    if(!cred.user.emailVerified){
      await sendEmailVerification(cred.user).catch(()=>{});
      toast('Please verify your email — check your inbox', 'warn');
    }
    await hydrateAfterLogin(cred.user);
  } catch (err) {
    state.authError =
      err.code === 'auth/invalid-credential' ? 'Invalid credentials' :
      err.code === 'auth/user-not-found'     ? 'User not found' :
      err.code === 'auth/wrong-password'     ? 'Wrong password' :
      err.code === 'auth/network-request-failed' ? 'Network error' :
      err.message || 'Login failed';
    render();
  }
}

function bindAuth(){
  const f = $('#loginForm'); if(!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(f);
    const identifier = String(fd.get('identifier')||'').trim().toLowerCase();
    const pw = String(fd.get('password')||'');
    if(!identifier || !pw){ state.authError='Enter credentials'; render(); return; }
    handleLogin(identifier, pw);
  });
}

async function googleSignIn(){
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const result = await signInWithPopup(auth, provider);
    await hydrateAfterLogin(result.user);
  } catch (err) { toast('Google Sign-In failed: ' + (err.message||err.code), 'err'); }
}

function planSelectorHTML(plans, defaultPlan, prefix=''){
  const enabled = Object.keys(plans).filter(k => plans[k]?.enabled);
  return enabled.map(k => {
    const p = plans[k];
    return `<label class="plan-card" style="cursor:pointer;background:var(--panel2);border:2px solid ${k===defaultPlan?'var(--acc)':'var(--line2)'};border-radius:12px;padding:14px;display:block"><input type="radio" name="${prefix}plan" value="${k}" ${k===defaultPlan?'checked':''} style="display:none"><div style="font-weight:800;font-size:13px">${esc(p.label)}</div><div style="font-size:20px;font-weight:800;color:var(--acc);margin:6px 0">${money(p.price)}</div><div style="font-size:11px;color:var(--muted)">${p.days} days</div></label>`;
  }).join('');
}
function bindPlanSelector(formSel, prefix=''){
  const form = document.querySelector(formSel); if(!form) return;
  const update = () => {
    document.querySelectorAll(`${formSel} input[name="${prefix}plan"]`).forEach(r => {
      const card = r.closest('.plan-card'); if(card) card.style.border = `2px solid ${r.checked ? 'var(--acc)' : 'var(--line2)'}`;
    });
    form.dispatchEvent(new CustomEvent('plan-change'));
  };
  document.querySelectorAll(`${formSel} input[name="${prefix}plan"]`).forEach(r => r.addEventListener('change', update));
  update();
}
function getGymUpi(gm){
  if(!gm) return '';
  if(gm.upiId && VALID_UPI.test(gm.upiId)) return gm.upiId;
  const d = String(gm.phone||'').replace(/\D/g,'');
  return d.length >= 10 ? d.slice(-10) + '@upi' : '';
}
function setUpiLinks(ids, upi, payeeName, amount, note){
  const setHref = (id, url) => {
    const el = document.getElementById(id); if(!el) return;
    if(url){ el.href = url; el.style.opacity=''; el.style.pointerEvents=''; }
    else { el.removeAttribute('href'); el.style.opacity='.5'; el.style.pointerEvents='none'; }
  };
  if(!upi || !VALID_UPI.test(upi)){ ids.forEach(id => setHref(id, null)); return; }
  setHref(ids[0], safeUpiUrl('upi://pay', { pa: upi, pn: payeeName, am: amount, cu:'INR', tn: note }));
  setHref(ids[1], safeUpiUrl('gpay://upi/pay', { pa: upi, pn: payeeName, am: amount }));
  setHref(ids[2], safeUpiUrl('phonepe://pay', { pa: upi, pn: payeeName, am: amount }));
}

function renderNav(){

function viewMPay(){
  const g = G(); const m = me(); if(!g||!m) return `<div class="empty">Not found</div>`;
  const mp = gymPlans(); const pp = (mp[m.plan]||{price:0}).price;
  const upi = g.upiId || ''; const upiOk = VALID_UPI.test(upi);
  const mk = (amt, note) => safeUpiUrl('upi://pay', { pa: upi, pn: g.name, am: amt.toFixed(2), cu:'INR', tn: note });
  const pays = (m.payments||[]).slice().reverse();
  return `<div class="grid g2"><div class="card"><div class="ch"><h3>Membership Payment</h3></div><div class="upi"><div class="lbl">Plan Price</div><div class="amt">${money(pp)}</div><div class="uid"><div><span class="k">Gym UPI</span><span class="v">${esc(upi||'Not set')}</span></div>${upiOk?`<button class="ib" data-act="copy" data-copy="${esc(upi)}">${icon('copy',14)}</button>`:''}</div>${upiOk?`<div class="uapps"><a class="uapp" href="${esc(mk(pp,'Membership')||'#')}"><div class="ico">📱</div><div>Any UPI</div></a></div>`:''}<button class="btn acc blk" style="padding:11px" data-act="mark-paid" data-amount="${pp}" data-note="Membership">${icon('check',14)} I've paid — Renew</button></div></div><div class="card"><div class="ch"><h3>History</h3></div>${pays.length?`<div class="list">${pays.map(p=>`<div class="lr"><div class="g"><div class="t">${esc(p.note||'Payment')}</div><div class="s">${fmtDate(p.date)}</div></div><div style="font-weight:800;color:var(--grn)">${money(p.amount)}</div></div>`).join('')}</div>`:`<div class="empty">No history</div>`}</div></div>`;

function openMemberDetail(id){
  const g = G(); if(!g) return;
  const m = (g.members||[]).find(x => x.id === id); if(!m) return;
  state.selectedMember = id; renderDetail();
}
function renderDetail(){
  const g = G(); if(!g) return closeModal();
  const m = (g.members||[]).find(x => x.id === state.selectedMember); if(!m) return closeModal();
  const totalPaid = (m.payments||[]).reduce((s,p)=>s+(p.amount||0),0);
  const pl = gymPlans()[m.plan] || {label:m.plan};
  const body = `<div class="kpis"><div class="kpi"><div class="k">Plan</div><div class="v" style="font-size:14px;color:${safeColor(PLAN_COLORS[m.plan]||'#c6ff3d')}">${esc(pl.label)}</div></div><div class="kpi"><div class="k">Paid</div><div class="v">${money(totalPaid)}</div></div><div class="kpi"><div class="k">Face</div><div class="v">${m.faceEnrolled?'✓':'—'}</div></div><div class="kpi"><div class="k">Door</div><div class="v" style="color:${m.doorAccess?'var(--grn)':'var(--dgr)'}">${m.doorAccess?'ON':'OFF'}</div></div></div><div class="div"></div><div class="ig"><div><div class="k">Email</div><div class="v">${esc(m.email)}</div></div><div><div class="k">Phone</div><div class="v">${esc(m.phone)}</div></div><div><div class="k">Goal</div><div class="v">${esc(m.goal||'—')}</div></div></div><div class="div"></div><div style="display:flex;gap:6px;flex-wrap:wrap">${['pending_payment','pending_approval'].includes(m.approvalStatus)?`<button class="btn acc sm" data-act="member-approve" data-id="${esc(m.id)}">${icon('check',12)} Verify & Approve</button>`:''}${m.approvalStatus==='face_pending'&&m.faceEnrolled&&m.paymentVerified?`<button class="btn acc sm" data-act="member-face-approve" data-id="${esc(m.id)}">${icon('check',12)} Approve Face</button>`:''}${m.approvalStatus==='approved'&&m.faceEnrolled&&!m.doorAccess&&m.status==='active'?`<button class="btn acc sm" data-act="member-door-on" data-id="${esc(m.id)}">${icon('unlock',12)} Enable Door</button>`:''}${m.doorAccess?`<button class="btn dgr sm" data-act="member-door-off" data-id="${esc(m.id)}">${icon('lock',12)} Disable</button>`:''}${m.status==='expired'?`<button class="btn wrn sm" data-act="member-renew" data-id="${esc(m.id)}">${icon('refresh',12)} Renew</button>`:''}</div>`;
  openModal(`<div class="mh"><button class="ib" data-act="modal-close">${icon('back',14)}</button>${avatar(m.name,44,m.profileImage)}<div style="flex:1"><h3>${esc(m.name)}</h3><div class="sub">${statusPill(m)}</div></div><button class="ib" data-act="modal-close">${icon('x',16)}</button></div><div class="mb">${body}</div>`,'xl');
}

      <div class="mb"><div class="fg"><div class="fl full"><label>Gym Name *</label><input class="inp" name="name" required value="${esc(d.name)}"></div><div class="fl"><label>City</label><input class="inp" name="city" value="${esc(d.city)}"></div><div class="fl"><label>Phone</label><input class="inp" name="phone" value="${esc(d.phone)}"></div><div class="fl full"><label>Address</label><input class="inp" name="address" value="${esc(d.address)}"></div><div class="fl full"><label>Owner Email *</label><input class="inp" type="email" name="ownerEmail" required value="${esc(d.ownerEmail||'')}"></div><div class="fl full"><label>Owner Phone *</label><input class="inp" name="ownerPhone" required value="${esc(d.ownerPhone||'')}"></div></div></div>
      <div class="mf"><button type="button" class="btn gho" data-act="modal-close">Cancel</button><button type="submit" class="btn acc">${icon('check',14)} ${isE?'Save':'Register'}</button></div>
    </form>`,'lg');
  $('#saGymForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      if(isE){
        await updateDoc(doc(db,'gyms',g.id), {
          name: f.get('name').trim(), city: f.get('city').trim(),
          phone: f.get('phone').trim(), address: f.get('address').trim(),
          ownerEmail: f.get('ownerEmail').trim().toLowerCase(),
          ownerPhone: f.get('ownerPhone').trim()
        });

  catch(e){ toast('Failed: ' + e.message, 'err'); }
}
async function blockGym(id, block){
  try { await callFn('saSetGymStatus', { gymId: id, status: block ? 'blocked' : 'active' }); toast(block?'Blocked':'Unblocked'); state.gyms = await loadAllGymsForSA(); render(); }
  catch(e){ toast('Failed: ' + e.message, 'err'); }
}

async function deleteGym(id){
  try {
    const g = state.gyms.find(x => x.id === id); if(!g) return;
    for(const m of g.members||[]) await deleteMemberDoc(id, m.id).catch(()=>{});
    for(const p of g.products||[]) await deleteProductDoc(id, p.id).catch(()=>{});
    await deleteDoc(doc(db,'gyms',id));
    state.gyms = state.gyms.filter(x => x.id !== id);
    render(); toast('Gym deleted','err');
  } catch(e){ toast('Delete failed: '+e.message,'err'); }
}

    </div><div class="mf"><button type="button" class="btn gho" data-act="modal-close">Cancel</button><button type="submit" class="btn acc">${icon('check',14)} ${isE?'Save':'Register'}</button></div></form>`,'lg');
  let memPhotoUrl = d.profileImage || null;
  $('#memPhotoInput').addEventListener('change', async e => {
    const file = e.target.files?.[0]; if(!file) return;
    try { memPhotoUrl = await uploadCompressedImage(file); $('#memPhotoPrev').innerHTML = `<img src="${esc(memPhotoUrl)}">`; }
    catch (err) { toast('Photo failed: ' + err.message, 'err'); }
  });
  $('#memberForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      if(isE){
        // Owner can edit profile + plan + status via updateDoc (member rules allow owner write)
        const plan = f.get('plan'); const start = f.get('startDate');
        await updateDoc(doc(db,'gyms',g.id,'members',id), {
          name: f.get('name').trim(), phone: f.get('phone').trim(),
          age: parseInt(f.get('age'))||25, weight: parseFloat(f.get('weight'))||70,
          gender: f.get('gender'), height: parseFloat(f.get('height'))||170,
          plan, startDate: start, endDate: addDays(start, mp[plan].days),
          trainer: f.get('trainer'), goal: f.get('goal'), profileImage: memPhotoUrl
        });
        state.gyms = [await loadGymBundle(g.id)]; closeModal(); render(); showSuccess('Updated', 'Saved.');
      } else {
        if(!memPhotoUrl){ toast('Photo required','err'); return; }
        const email = (f.get('email')||'').trim().toLowerCase();
        const pw = String(f.get('password')||'');
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        await cred.user.reload();
        await sendEmailVerification(cred.user).catch(()=>{});
        await callFn('registerMember', {
          gymId: g.id, name: f.get('name').trim(), phone: f.get('phone').trim(),
          age: parseInt(f.get('age'))||25, weight: parseFloat(f.get('weight'))||70,
          height: parseFloat(f.get('height'))||170, gender: f.get('gender'),
          goal: f.get('goal'), trainer: f.get('trainer'), plan: f.get('plan'),
          startDate: f.get('startDate'), profileImage: memPhotoUrl
        });
        await signOut(auth);
        state.gyms = [await loadGymBundle(g.id)]; closeModal(); render(); showSuccess('Member Registered', 'Saved.');
      }
    } catch (err) { toast('Failed: ' + (err.message||err.code), 'err'); }
  });
}

// ═══════════════════════════════════════════════════════════════
// FACE SCAN — server-side unlock
// ═══════════════════════════════════════════════════════════════
async function gymScanStart(){
  const video = $('#gymScanVideo'); if(!video) return;
  if(window.__gymScanStream){ toast('Camera already running'); return; }
  try { window.__gymScanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); video.srcObject = window.__gymScanStream; video.play().catch(()=>{}); toast('Camera ready'); }
  catch (err) { toast('Camera denied: ' + err.message,'err'); }
}
function gymScanStop(){
  if(window.__gymScanStream){ window.__gymScanStream.getTracks().forEach(t => t.stop()); window.__gymScanStream = null; }
  const v = $('#gymScanVideo'); if(v) v.srcObject = null;
}
async function gymScanNow(){
  const g = G(); if(!g) return;
  const video = $('#gymScanVideo'); const resultBox = $('#gymScanResult');
  if(!video) return;
  if(!window.__gymScanStream){ await gymScanStart(); await new Promise(r=>setTimeout(r, 700)); }
  if(!window.__gymScanStream){ if(resultBox){ resultBox.className='face-result err'; resultBox.style.display='block'; resultBox.textContent='Camera not available'; } return; }
  try {
    const tpl = await computeFaceTemplate(video); gymScanStop();
    const candidates = (g.members||[]).filter(m => m.faceEnrolled && m.doorAccess && m.status==='active' && m.approvalStatus==='approved' && m.faceTemplateHash);
    let match = null;
    for(const m of candidates){ if(await hammingMatches(m.faceTemplateHash, tpl)){ match = m; break; } }
    if(!match){ if(resultBox){ resultBox.className='face-result err'; resultBox.style.display='block'; resultBox.textContent='❌ No matching member.'; } toast('No match','err'); return; }
    if(resultBox){ resultBox.className='face-result ok'; resultBox.style.display='block'; resultBox.textContent=`✅ Verified: ${match.name} — unlocking…`; }
    try {
      await callFn('unlockDoor', { gymId: g.id, memberId: match.id, method: 'kiosk' });
      toast(`🚪 Door unlocked for ${match.name}`);
      if(resultBox){ resultBox.className='face-result ok'; resultBox.textContent=`🚪 Door unlocked for ${match.name}`; }
    } catch (cfErr) {
      toast('❌ Door failed: ' + cfErr.message, 'err');
      if(resultBox){ resultBox.className='face-result err'; resultBox.textContent='❌ ' + cfErr.message; }
    }
  } catch (err) { toast('Scan failed: ' + err.message,'err'); if(resultBox){ resultBox.className='face-result err'; resultBox.style.display='block'; resultBox.textContent='Scan failed: ' + err.message; } }
}

  if(t === 'referralForm'){ e.preventDefault(); const g = G(); if(!g) return; const f = new FormData(e.target); const next = {referralEnabled:f.get('enabled')==='on', reward:parseFloat(f.get('reward'))||0, discount:parseFloat(f.get('discount'))||0, minReferrals:1, rewardType:'cash', terms:''}; try { await updateDoc(doc(db,'gyms',g.id), {settings:next}); g.settings = next; toast('Saved ✓'); render(); } catch(e){ toast('Failed: '+e.message,'err'); } return; }
  if(t === 'gymAdminLoginForm'){ e.preventDefault(); const f = new FormData(e.target); const gid = e.target.dataset.gymid; try { const cred = await signInWithEmailAndPassword(auth, (f.get('identifier')||'').trim().toLowerCase(), f.get('password')); const profileSnap = await getDoc(doc(db,'users',cred.user.uid)); if(!profileSnap.exists() || profileSnap.data().gymId !== gid || profileSnap.data().role !== 'gymowner'){ await signOut(auth); const errEl = $('#gymAdminLoginError'); if(errEl){ errEl.textContent='Not this gym\\'s owner'; errEl.style.display='flex'; } return; } closeModal(); await hydrateAfterLogin(cred.user); } catch (err) { const errEl = $('#gymAdminLoginError'); if(errEl){ errEl.textContent = err.message; errEl.style.display='flex'; } } return; }
  if(t === 'gymMemberLoginForm'){ e.preventDefault(); const f = new FormData(e.target); const gid = e.target.dataset.gymid; try { const cred = await signInWithEmailAndPassword(auth, (f.get('username')||'').trim().toLowerCase(), f.get('password')); const profileSnap = await getDoc(doc(db,'users',cred.user.uid)); if(!profileSnap.exists() || profileSnap.data().gymId !== gid || profileSnap.data().role !== 'member'){ await signOut(auth); const errEl = $('#gymLoginError'); if(errEl){ errEl.textContent='Not this gym\\'s member'; errEl.style.display='flex'; } return; } closeModal(); await hydrateAfterLogin(cred.user); } catch (err) { const errEl = $('#gymLoginError'); if(errEl){ errEl.textContent = err.message; errEl.style.display='flex'; } } return; }
});

// UPI link validation
document.addEventListener('click', (e) => {
  const a = e.target.closest('a.upi-btn, a.uapp'); if(!a) return;
  const href = a.getAttribute('href');
  if(!href || href === '#' || href === 'undefined' || href === 'null'){ e.preventDefault(); toast('UPI not configured', 'err'); }
}, true);

function renderBrandFields(brand, cfg){
  const fields = {
    'http-apikey':[{k:'url',l:'Unlock URL'},{k:'apiKey',l:'API Key',t:'password'},{k:'apiHeader',l:'Header'},{k:'method',l:'Method'}],
    'http-basic':[{k:'url',l:'URL'},{k:'username',l:'Username'},{k:'password',l:'Password',t:'password'}],
    'tuya':[{k:'clientId',l:'Client ID'},{k:'clientSecret',l:'Client Secret',t:'password'},{k:'deviceId',l:'Device ID'},{k:'region',l:'Region'}],
    'bearer':[{k:'url',l:'URL'},{k:'token',l:'Token',t:'password'}],
    'zkteco':[{k:'url',l:'Device URL'},{k:'username',l:'Username'},{k:'password',l:'Password',t:'password'}],
    'custom':[{k:'url',l:'API URL'},{k:'method',l:'Method'},{k:'headers',l:'Headers (JSON)'},{k:'body',l:'Body (JSON)'}]
  }[brand.protocol] || [];
  return fields.map(f => `<div class="fl" style="margin-bottom:10px"><label>${esc(f.l)}</label><input class="inp" name="${f.k}" type="${f.t||'text'}" value="${esc(cfg[f.k]||'')}"></div>`).join('');
}

async function sendChat(textOverride){
  const input = $('#chatInput');
  const text = (textOverride ?? input?.value ?? '').trim(); if(!text) return;
  state.aiChat.push({role:'user', content:text}); if(input) input.value=''; render();
  try {
    const g = G(); const m = me();
    const reply = await askAI(`You are a fitness coach at ${g.name}. Member: ${m.name}, goal ${m.goal}. Under 180 words.`, text);
    state.aiChat.push({role:'assistant', content:reply}); render();
    const cs = $('#chatScroll'); if(cs) cs.scrollTop = cs.scrollHeight;
  } catch (err) { state.aiChat.push({role:'assistant', content:'⚠ ' + err.message}); render(); }
}

function updateOnlineBar(){ const b = $('#offlineBar'); if(b) b.style.display = navigator.onLine ? 'none' : ''; }
window.addEventListener('online', () => { updateOnlineBar(); toast('Back online'); });
window.addEventListener('offline', () => { updateOnlineBar(); toast('Offline','warn'); });
updateOnlineBar();

try { const saved = localStorage.getItem('migym_ai'); if(saved) state.aiConfig = JSON.parse(saved); } catch {}

onAuthStateChanged(auth, async user => {
  if(!user) return;
  if(state.auth.uid && state.auth.uid === user.uid) return;
  try { await hydrateAfterLogin(user); } catch (e) { console.warn('Auth hydrate', e); }
});

(async function init(){
  setupManifest();
  try { render(); } catch(e){ console.error('Initial render', e); }
  try {
    const sys = await loadSystemBundle();
    if(sys.config) state.platformConfig = { superUpiId: sys.config.superUpiId || '', superUpiName: sys.config.superUpiName || 'MiGym Platform', superEmail: sys.config.superEmail || '' };
    if(sys.flags) state.flags = { ...state.flags, ...sys.flags };
    if(sys.plans) state.superadminPlans = sys.plans;
    if(sys.brands && Array.isArray(sys.brands.list)) state.faceBrands = sys.brands.list;
  } catch(e){ console.warn('System bundle', e); }
  try { state.gyms = await loadAllPublicGyms(); } catch { state.gyms = []; }
  const params = new URLSearchParams(window.location.search);
  if(params.has('gym')) state.publicGymId = params.get('gym');
  if(params.has('ref')) state.pendingRefCode = params.get('ref');
  if(state.publicGymId){ try { const g = await loadGymBundle(state.publicGymId); state.gyms = [g]; } catch {} }
  render();
  console.log('%c MiGym Pro · Hardened ','background:#c6ff3d;color:#0b0d07;font-weight:800;padding:2px 6px;border-radius:4px');
})();

window.addEventListener('popstate', () => {
  if($('#modalRoot').innerHTML){ closeModal(); history.pushState(null,'',location.href); return; }
  if(state.publicGymId){ state.publicGymId = null; render(); history.pushState(null,'',location.href); return; }
  if(isAuth()){ const home = isSA()?'sa-dash':isGO()?'dashboard':'m-home'; if(state.route !== home){ state.route = home; render(); } history.pushState(null,'',location.href); }
});
history.pushState(null,'',location.href);
</script>
