[build]
  publish = "."

# 1. Force Android to find the assetlinks file
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/migym/.well-known/assetlinks.json"
  status = 200

# 2. SPA routing for the app subfolder
[[redirects]]
  from = "/migym/*"
  to = "/migym/index.html"
  status = 200
