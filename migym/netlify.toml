# MiGym Pro — Netlify configuration
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# ============ SECURITY HEADERS ============
# NOTE: CSP is defined in index.html <meta> — do NOT duplicate here,
# because the browser applies the most restrictive combination, and a
# second CSP here could break Firebase / Cloudinary / AI provider calls.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-XSS-Protection = "1; mode=block"

# ============ CACHING ============
# HTML: never cache (always fetch fresh so app updates land immediately)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/privacy-policy.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Logo: cache for 1 year (never changes)
[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manifest: correct MIME type + cache
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Asset links: correct MIME type (required for TWA verification)
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Robots: cache
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"