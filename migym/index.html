<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mi Gym Pro</title>
    <meta name="theme-color" content="#07080a">
    <style>
        :root {
            --bg: #07080a;
            --txt: #ffffff;
            --acc: #c6ff3d;
            --acc-glow: rgba(198, 255, 61, 0.4);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(198, 255, 61, 0.15), transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(77, 157, 255, 0.08), transparent 50%);
            color: var(--txt);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: rgba(15, 17, 21, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 60px 40px;
            border-radius: 32px;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 24px;
            border-radius: 24px;
            filter: drop-shadow(0 0 20px rgba(198, 255, 61, 0.25));
            animation: float 5s ease-in-out infinite;
        }
        h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin-bottom: 40px;
            background: linear-gradient(180deg, #ffffff 0%, #a0aab8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--acc);
            color: #0b0d07;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            padding: 16px 48px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            box-shadow: 0 0 0 rgba(198, 255, 61, 0);
        }
        .btn:hover {
            background-color: #d4ff66;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 30px var(--acc-glow);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        /* Hide Netlify elements */
        iframe[title*="Netlify"], div[id*="netlify"], a[href*="netlify.com"], div[class*="netlify"], netlify-badge, #netlify-badge, iframe[title="Netlify Drawer"] {
            display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; z-index: -9999 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <h1>Mi Gym Pro</h1>
        <a href="migympro.html" class="btn">Enter</a>
    </div>

    <script>
        (function killNetlifyBadge() {
            const removeBadge = () => {
                const selectors = ['#netlify-badge', '.netlify-badge', 'netlify-badge', 'netlify-drawer', '#netlify-drawer', 'iframe[title*="Netlify"]', 'iframe[src*="netlify"]'];
                selectors.forEach(sel => {
                    document.querySelectorAll(sel).forEach(el => { el.style.setProperty('display', 'none', 'important'); el.remove(); });
                });
                document.querySelectorAll('a, div, iframe').forEach(el => {
                    if (el.textContent && el.textContent.includes('Powered by Netlify')) el.remove();
                });
            };
            removeBadge();
            setInterval(removeBadge, 200);
            const observer = new MutationObserver(() => removeBadge());
            observer.observe(document.body, { childList: true, subtree: true });
        })();
    </script>
</body>
</html>
