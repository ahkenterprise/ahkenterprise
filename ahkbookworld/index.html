<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#103d32">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Abdul Hameed Kunhi | Welcome</title>
<meta name="description" content="Welcome to the official book collection of Abdul Hameed Kunhi. Discover, Learn, Grow.">
<style>
:root {
  --bg: #f5f3ee;
  --accent: #103d32;
  --gold: #e5b65b;
  --gold-hover: #f2c66d;
  --ink: #202d29;
  --muted: #65716c;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background-color: var(--bg);
  color: var(--ink);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* Decorative Background Circles */
body::before, body::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  z-index: 0;
}
body::before {
  width: 60vw;
  height: 60vw;
  background: rgba(16, 61, 50, 0.04);
  top: -20vw;
  right: -20vw;
}
body::after {
  width: 40vw;
  height: 40vw;
  background: rgba(229, 182, 91, 0.08);
  bottom: -15vw;
  left: -15vw;
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 30px 20px;
  max-width: 600px;
  width: 100%;
  animation: fadeIn 1s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Logo Styling */
.logo-wrapper {
  width: 140px;
  height: 140px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background-color: var(--accent);
  border: 3px solid var(--gold);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 10px 25px rgba(16, 61, 50, 0.15);
}

.logo-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none; /* Hidden by default, shown via JS if loaded */
}

.logo-fallback-text {
  font-family: Georgia, serif;
  font-size: 36px;
  color: var(--gold);
  font-weight: bold;
  letter-spacing: 2px;
}

/* Text Styling */
h1 {
  font-family: Georgia, serif;
  font-size: clamp(28px, 6vw, 42px);
  color: var(--accent);
  margin-bottom: 12px;
  line-height: 1.2;
}

.tagline {
  font-size: clamp(14px, 3vw, 16px);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: bold;
  margin-bottom: 24px;
}

.description {
  font-size: 16px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 40px;
  padding: 0 10px;
}

/* Button Styling */
.enter-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: var(--accent);
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  padding: 16px 40px;
  border-radius: 50px;
  box-shadow: 0 8px 20px rgba(16, 61, 50, 0.25);
  transition: all 0.3s ease;
  border: 2px solid transparent;
}

.enter-btn:hover, .enter-btn:active {
  background-color: var(--gold);
  color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(229, 182, 91, 0.4);
}

.enter-btn svg {
  margin-left: 8px;
  width: 20px;
  height: 20px;
  transition: transform 0.3s ease;
}

.enter-btn:hover svg {
  transform: translateX(4px);
}

footer {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  z-index: 1;
}

/* Mobile Adjustments */
@media (max-width: 480px) {
  .logo-wrapper { width: 110px; height: 110px; margin-bottom: 20px; }
  .logo-fallback-text { font-size: 28px; }
  .description { font-size: 15px; margin-bottom: 30px; }
  .enter-btn { width: 100%; padding: 16px 20px; }
}
</style>
</head>
<body>

<div class="container">
  
  <!-- LOGO WITH FALLBACK -->
  <div class="logo-wrapper">
    <div class="logo-fallback-text" id="logoFallback">AHK</div>
    <img id="mainLogo" src="logo.png" alt="Abdul Hameed Kunhi Logo">
  </div>

  <h1>Abdul Hameed Kunhi</h1>
  <div class="tagline">Discover. Learn. Grow.</div>
  
  <p class="description">
    Welcome to the official book collection. Step inside to explore practical ideas, develop new skills, and find your next great read.
  </p>

  <!-- LINK TO YOUR APP -->
  <a href="ahkbw.html" class="enter-btn">
    Enter Book World
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
  </a>

</div>

<footer>
  &copy; 2024 Abdul Hameed Kunhi. All rights reserved.
</footer>

<script>
  // Auto-detect Logo Logic (Tries logo.png, then logo.jpeg, then logo.jpg)
  document.addEventListener("DOMContentLoaded", function() {
    const logoImg = document.getElementById("mainLogo");
    const fallbackText = document.getElementById("logoFallback");
    const extensions = ["logo.png", "logo.jpeg", "logo.jpg", "logo.PNG", "logo.JPEG"];
    let currentIndex = 0;

    // Function to try the next image
    function tryNextImage() {
      currentIndex++;
      if (currentIndex < extensions.length) {
        logoImg.src = extensions[currentIndex];
      } else {
        // If all fail, show the text fallback
        logoImg.style.display = "none";
        fallbackText.style.display = "block";
      }
    }

    // When an image loads successfully, show it and hide the text
    logoImg.onload = function() {
      logoImg.style.display = "block";
      fallbackText.style.display = "none";
    };

    // If the image fails to load, try the next extension
    logoImg.onerror = function() {
      tryNextImage();
    };

    // Initial trigger to start checking
    logoImg.src = extensions[0];
  });
</script>

</body>
</html>
