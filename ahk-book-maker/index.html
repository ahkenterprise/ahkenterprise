<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHK Book Maker – Book Cover &amp; PDF Creator</title>
<meta name="description" content="Create print-ready book covers and interior PDFs for KDP, Pothi and IngramSpark.">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0707; --panel:#171010; --line:#3a1b1b;
  --red:#d81f26; --red-deep:#9d1218; --gold:#e8b24a; --paper:#f6efe6; --muted:#b9aca3;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{
  min-height:100%;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(216,31,38,.28), transparent 70%),
    radial-gradient(ellipse 50% 40% at 50% 100%, rgba(232,178,74,.10), transparent 70%),
    var(--ink);
  color:var(--paper);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  line-height:1.6;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
main{max-width:720px;margin:0 auto;padding:56px 24px 40px;text-align:center}
.icon{
  width:min(260px,62vw);height:auto;aspect-ratio:1/1;object-fit:contain;display:block;margin:0 auto 32px;
  border-radius:22%;
  box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(216,31,38,.35),0 0 90px rgba(232,178,74,.18);
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
h1{
  font-family:'Playfair Display',Georgia,'Times New Roman',serif;
  font-weight:800;font-size:clamp(2.4rem,8vw,3.8rem);line-height:1.05;letter-spacing:-.01em;
}
.sub{margin:16px auto 0;max-width:34ch;font-size:1.125rem;color:var(--muted)}
.cta{
  display:inline-block;margin-top:36px;padding:16px 40px;border-radius:999px;
  background:linear-gradient(180deg,var(--red),var(--red-deep));
  color:#fff;text-decoration:none;font-weight:600;font-size:1.125rem;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 30px rgba(216,31,38,.4);
  transition:transform .15s ease,box-shadow .15s ease;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(216,31,38,.55)}
.cta:active{transform:translateY(0)}
.cta:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.features{
  list-style:none;padding:0;margin:56px 0 0;
  display:grid;gap:14px;text-align:left;
}
.features li{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:10px;padding:16px 18px;
}
.features strong{display:block;font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;color:var(--paper)}
.features span{color:var(--muted);font-size:.975rem}
footer{margin-top:48px;color:var(--muted);font-size:.875rem}
@media(min-width:640px){.features{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){.icon{animation:none}.cta{transition:none}}
</style>
</head>
<body>
<main>
  <img class="icon" src="icon-512.png" alt="AHK Book Maker app icon">
  <h1>AHK Book Maker</h1>
  <p class="sub">Book cover and PDF creator for print-ready books.</p>
  <a class="cta" href="ahkcm.html">Open Book Maker</a>

  <ul class="features">
    <li><strong>Cover wrap</strong><span>Front, spine and back in one print-ready layout.</span></li>
    <li><strong>Interior PDF</strong><span>Scale your pages to the right trim size.</span></li>
    <li><strong>Print platforms</strong><span>KDP, Pothi and IngramSpark.</span></li>
  </ul>
  <footer>© AHK</footer>
</main>
</body>
</html>
